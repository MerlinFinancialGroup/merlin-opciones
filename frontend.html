<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merlin Options</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0d0a;color:#e8e0cc;font-family:'Syne',sans-serif;font-size:13px;min-height:100vh}

/* ── AUTH ── */
#auth-screen{display:flex;align-items:center;justify-content:center;height:100vh}
.auth-box{text-align:center;border:0.5px solid #2a2510;padding:40px 60px;border-radius:12px;background:#12100a}
.auth-box h2{color:#C9960A;font-size:20px;margin-bottom:8px}
.auth-box p{color:#a09880;font-size:12px;margin-bottom:24px}

/* ── HEADER ── */
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;border-bottom:1px solid #2a2510;background:#12100a;position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-title{color:#C9960A;font-size:1.1rem;font-weight:700;letter-spacing:.02em}
.header-pills{display:flex;gap:8px;align-items:center}
.pill{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;border:0.5px solid #2a2510;color:#c8c0b0}
.pill.live{border-color:#2d6a3e;color:#3ab07a;animation:pulse 2s infinite}
.pill.err{border-color:#7a2e26;color:#c0392b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.header-right{display:flex;gap:16px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#a09880}
.header-right .val{color:#e8e0cc;font-weight:500}
.header-right .val.up{color:#3ab07a}

/* ── MAIN LAYOUT ── */
.main{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 45px)}

/* ── SIDEBAR ── */
.sidebar{background:#12100a;border-right:1px solid #2a2510;overflow-y:auto;padding:12px 0;scrollbar-width:thin;scrollbar-color:#2a2510 transparent}
.sidebar::-webkit-scrollbar{width:3px}.sidebar::-webkit-scrollbar-thumb{background:#2a2510}
.sb-section{margin-bottom:4px}
.sb-label{padding:8px 14px 3px;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#706858;font-family:'JetBrains Mono',monospace;font-weight:600}
.sb-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 14px;background:none;border:none;border-left:2px solid transparent;color:#c8c0b0;cursor:pointer;text-align:left;font-size:12px;font-family:'Syne',sans-serif;transition:all .1s}
.sb-btn:hover{background:#1a1710;color:#e8e0cc}
.sb-btn.active{background:rgba(201,150,10,.06);color:#C9960A;border-left-color:#C9960A}
.sb-vol{font-family:'JetBrains Mono',monospace;font-size:10px;color:#706858}
.sb-btn.active .sb-vol{color:#c8c0b0}

/* ── PANEL ── */
.panel{display:flex;flex-direction:column;overflow:hidden}

/* ── SUBY HEADER ── */
.suby-header{padding:12px 20px 10px;border-bottom:1px solid #2a2510;background:#12100a;flex-shrink:0}
.suby-title{font-size:18px;font-weight:600;color:#C9960A;margin-bottom:4px}
.suby-meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.meta-item{font-family:'JetBrains Mono',monospace;font-size:11px;color:#a09880}
.meta-item span{color:#e8e0cc}
.meta-item span.up{color:#3ab07a}
.meta-item span.dn{color:#c0392b}
.meta-item span.gold{color:#C9960A;font-weight:500}

/* ── CONTROLS ── */
.controls{display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid #2a2510;background:#0e0d0a;flex-shrink:0;flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-lbl{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.8px;color:#706858}
.ctrl-select{background:#12100a;border:0.5px solid #2a2510;color:#e8e0cc;padding:4px 8px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace;outline:none;cursor:pointer}
.ctrl-select:focus{border-color:#C9960A}
.tab-btns{display:flex;gap:1px;margin-left:auto}
.tab-btn{padding:4px 14px;background:none;border:0.5px solid #2a2510;color:#a09880;cursor:pointer;font-size:11px;font-family:'Syne',sans-serif;transition:all .1s}
.tab-btn:first-child{border-radius:4px 0 0 4px}
.tab-btn:last-child{border-radius:0 4px 4px 0}
.tab-btn.active{background:#C9960A;color:#0e0d0a;border-color:#C9960A;font-weight:600}
.csv-btn{margin-left:8px;padding:4px 12px;background:none;border:0.5px solid #2a2510;color:#a09880;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;border-radius:4px;transition:all .1s}
.csv-btn:hover{border-color:#C9960A;color:#C9960A}

/* ── CADENA TABLE ── */
.content{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a2510 transparent}
.content::-webkit-scrollbar{width:4px;height:4px}.content::-webkit-scrollbar-thumb{background:#2a2510}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{position:sticky;top:0;background:#12100a;padding:6px 10px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:#706858;border-bottom:1px solid #2a2510;white-space:nowrap;z-index:5}
thead th:first-child{position:sticky;left:0;text-align:left;z-index:6}
thead th.center{text-align:center}
tbody tr{border-bottom:0.5px solid rgba(42,37,16,.5);transition:background .08s}
tbody tr:hover{background:#1a1710}
tbody tr.atm{background:rgba(201,150,10,.04)}
tbody tr.atm:hover{background:rgba(201,150,10,.08)}
td{padding:5px 10px;text-align:right;font-family:'JetBrains Mono',monospace;color:#c8c0b0;white-space:nowrap}
tbody td:first-child{position:sticky;left:0;background:#0e0d0a;z-index:4;text-align:left;color:#e8e0cc;font-weight:500}
tbody tr.atm td:first-child{background:#131109}
tbody tr:hover td:first-child{background:#1a1710}
tbody tr.atm:hover td:first-child{background:#181507}
/* FIX: el symbol no puede empujar el ancho de la columna (antes deformaba toda la tabla) */
.sym{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sym.raw{color:#a09880;font-style:italic}
td.center{text-align:center}
td.muted{color:#706858}
.badge-itm{background:rgba(58,176,122,.1);color:#3ab07a;border:0.5px solid #2d6a3e;padding:1px 5px;border-radius:3px;font-size:9px}
.badge-otm{background:rgba(90,78,42,.1);color:#a09880;border:0.5px solid #2a2510;padding:1px 5px;border-radius:3px;font-size:9px}
.badge-atm{background:rgba(201,150,10,.15);color:#C9960A;border:0.5px solid rgba(201,150,10,.3);padding:1px 5px;border-radius:3px;font-size:9px}

/* ── RESUMEN ── */
.resumen-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px}
.res-card{background:#12100a;border:0.5px solid #2a2510;border-radius:6px;padding:12px 14px}
.res-title{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:#706858;margin-bottom:8px}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:0.5px solid #1a1710}
.res-row:last-child{border-bottom:none}
.res-suby{color:#e8e0cc;font-size:12px;font-weight:500}
.res-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9960A}
.res-bar{height:3px;background:#2a2510;border-radius:2px;margin-top:3px}
.res-bar-fill{height:3px;background:#C9960A;border-radius:2px;transition:width .3s}

/* ── EMPTY / LOADING ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#706858;gap:10px;text-align:center;padding:40px}
.empty p{font-size:13px;line-height:1.6;max-width:280px}
.loading{display:flex;align-items:center;justify-content:center;height:100%;font-family:'JetBrains Mono',monospace;font-size:11px;color:#706858}

/* ── Colores genéricos ── */
.pos{color:#3ab07a}
.neg{color:#c0392b}
.gold{color:#C9960A;font-weight:600}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" style="display:none">
  <div class="auth-box">
    <h2>Merlin Options</h2>
    <p>Acceso solo para suscriptores</p>
    <p style="color:#c0392b;font-size:11px">Ingresá desde el portal Merlin Financial Group</p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header class="header">
    <div class="logo-wrap">
      <div class="logo-title">Merlin Options</div>
      <div class="header-pills">
        <div class="pill live" id="live-pill">● conectando...</div>
        <div class="pill">IAMC · BYMA</div>
        <div class="pill" id="fecha-pill">—</div>
      </div>
    </div>
    <div class="header-right">
      <span>Fecha datos:</span><span class="val" id="h-fecha">—</span>
      <span>Opciones:</span><span class="val up" id="h-total">—</span>
      <span id="h-updated" style="font-size:9px;color:#706858"></span>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="loading" style="height:200px">Cargando...</div>
    </aside>

    <section class="panel">
      <div id="suby-header" class="suby-header" style="display:none">
        <div class="suby-title" id="suby-name">—</div>
        <div class="suby-meta" id="suby-meta"></div>
      </div>

      <div class="controls" id="controls" style="display:none">
        <div class="ctrl-group">
          <span class="ctrl-lbl">Tipo</span>
          <select class="ctrl-select" id="ctrl-tipo">
            <option value="">Todos</option>
            <option value="CALL">CALL</option>
            <option value="PUT">PUT</option>
          </select>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-lbl">Vencimiento</span>
          <select class="ctrl-select" id="ctrl-vto">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-lbl">Mostrar</span>
          <select class="ctrl-select" id="ctrl-show">
            <option value="all">Todos los strikes</option>
            <option value="traded">Solo con operaciones</option>
            <option value="oi">Con open interest</option>
          </select>
        </div>
        <div class="tab-btns">
          <button class="tab-btn active" data-view="cadena">Cadena</button>
          <button class="tab-btn" data-view="smile">IV Smile</button>
          <button class="tab-btn" data-view="resumen">Resumen</button>
        </div>
        <button class="csv-btn" id="btn-csv" title="Descargar cadena filtrada como CSV">↓ CSV</button>
      </div>

      <div class="content" id="content">
        <div class="empty">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M8 40 L16 24 L24 30 L32 16 L40 40" stroke="#2a2510" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p>Seleccioná un subyacente del panel izquierdo</p>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const API = 'https://web-production-2a938.up.railway.app';
const SUPABASE_URL  = 'https://zqnxkgqalhhybcnzgjfk.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxbnhrZ3FhbGhoeWJjbnpnamZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Mzk3MDEsImV4cCI6MjA5NDUxNTcwMX0.GD0RHfLGzplLhL1E-_GUHh3HXSNsZsvFi436wcm2tD4';

const ATM_TOL  = 0.01;   // ±1% del spot = ATM
const PC_CAP   = 50;     // P/C por encima de esto se muestra como ">50"
const IV_MIN   = 0.5;    // IV por debajo de esto = basura del solver → null
const IV_MAX   = 500;    // IV por encima de esto = basura → null
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// Prefijos de subyacentes conocidos (para parsear tipo/strike desde el ticker).
// Importante: SUPV termina en "V" — sin esta lista, el parser genérico lo confunde con un PUT.
const KNOWN_PREFIXES = ['GGAL','YPFD','BBAR','TXAR','METR','CRES','SUPV','BYMA','TGSU2','EDN','VIST'];

// ── HELPERS ────────────────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (typeof AbortSignal !== 'undefined' && !AbortSignal.timeout) {
  AbortSignal.timeout = ms => {
    const c = new AbortController();
    setTimeout(() => c.abort(new DOMException('Timeout','TimeoutError')), ms);
    return c.signal;
  };
}

function fjson(url, opts = {}) {
  return fetch(url, { ...opts, signal: opts.signal ?? AbortSignal.timeout(15000) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function vtoLabel(v) {
  const d = new Date(v + 'T00:00:00');
  return isNaN(d) ? v : `${MESES[d.getMonth()]} ${d.getDate()}`;
}

function showEmpty(msg) {
  const el = document.getElementById('content');
  el.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'empty';
  const p = document.createElement('p');
  p.textContent = msg;
  div.appendChild(p);
  el.appendChild(div);
}

// ── STATE ──────────────────────────────────────────────────────────────────────
let state = {
  subyacentes: [],
  cadena: [],
  resumen: {},
  currentSuby: null,
  view: 'cadena',
  dropped: 0,
};
let cadenaAbort = null;
let lastCadenaJson = null;

// ── AUTH (pendiente de integración con el portal) ─────────────────────────────
async function validarToken(token) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/validate_session`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': 'Bearer ' + SUPABASE_ANON,
      },
      body: JSON.stringify({ p_token: token }),
      signal: AbortSignal.timeout(5000),
    });
    if (!r.ok) return false;
    return await r.json() === true;
  } catch(e) {
    return false;
  }
}

// ── SANITIZACIÓN (defensas contra el feed IAMC) ────────────────────────────────
// Extrae tipo y strike desde el ticker. Convención BYMA: SUBY + C/V + strike + (OC|DI)
// Ej: YPFC9400DI → CALL 9400 · TXAV580.DI → PUT 580 · GFVC4200OC → PUT 4200
function parseTicker(sym) {
  const token = String(sym || '').trim().split(/\s+/)[0].toUpperCase();
  if (!token) return { symbol: '', tipo: null, strike: null };

  // 1) Si el token arranca con un subyacente conocido, lo que sigue es marcador+strike.
  //    (evita que "SUPVC4700OC" se interprete como PUT por la V de SUPV)
  const known = [...new Set([...KNOWN_PREFIXES, ...state.subyacentes.map(s => s.subyacente)])]
    .filter(t => token.startsWith(t))
    .sort((a,b) => b.length - a.length)[0];

  const rest = known ? token.slice(known.length) : token;
  let m = rest.match(/^\.?([CV])(\d{2,7}(?:\.\d+)?)\.?(?:OC|DI)?$/);
  if (m) return { symbol: token, tipo: m[1] === 'C' ? 'CALL' : 'PUT', strike: parseFloat(m[2]) };

  // 2) Fallback genérico: primer C/V seguido del strike al final del token
  m = token.match(/^(.+?)([CV])(\d{2,7}(?:\.\d+)?)\.?(?:OC|DI)?$/);
  if (m) return { symbol: token, tipo: m[2] === 'C' ? 'CALL' : 'PUT', strike: parseFloat(m[3]) };

  return { symbol: token, tipo: null, strike: null };
}

// Moneyness calculada localmente — el backend marca TODOS los puts como OTM
function moneynessOf(strike, spot, tipo) {
  if (!(strike > 0) || !(spot > 0) || (tipo !== 'CALL' && tipo !== 'PUT')) return null;
  const diff = (strike - spot) / spot;
  if (Math.abs(diff) < ATM_TOL) return 'ATM';
  if (tipo === 'CALL') return diff < 0 ? 'ITM' : 'OTM';
  return diff > 0 ? 'ITM' : 'OTM'; // PUT: strike > spot = ITM
}

const PRICE_FIELDS = ['ultimo_precio','apertura_prima','min_prima','max_prima','precio_teorico'];

function sanitizeCadena(rawRows) {
  const spot = rawRows.find(r => r.precio_suby > 0)?.precio_suby || 0;
  const out = [];
  const droppedSyms = [];
  let rawCount = 0;

  for (let r of rawRows) {
    // 1) El backend metió la línea cruda del feed en symbol → recuperar ticker/strike/tipo
    if (/\s/.test(String(r.symbol || '').trim())) {
      const info = parseTicker(r.symbol);
      r = {
        ...r,
        symbol: info.symbol,
        symbol_raw: String(r.symbol).trim(),
        tipo: (r.tipo === 'CALL' || r.tipo === 'PUT') ? r.tipo : info.tipo,
        strike: (r.strike > 0) ? r.strike : info.strike,
        _raw: true,
      };
      rawCount++;
    }
    // 2) Tipo ausente → deducir del ticker
    if (r.tipo !== 'CALL' && r.tipo !== 'PUT') {
      const info = parseTicker(r.symbol);
      if (!info.tipo) { droppedSyms.push(r.symbol); continue; }
      r = { ...r, tipo: info.tipo };
    }
    // 3) Strike ausente o inválido → deducir del ticker; sin strike la fila no sirve
    if (!(r.strike > 0)) {
      const info = parseTicker(r.symbol);
      if (!info.strike) { droppedSyms.push(r.symbol); continue; }
      r = { ...r, strike: info.strike };
    }
    // 4) Precios negativos → no existen primas negativas
    const patch = {};
    for (const f of PRICE_FIELDS) {
      if (r[f] != null && r[f] < 0) patch[f] = null;
    }
    // 5) Teórico $0 = solver roto → teórico y desvío no son confiables
    if (!(r.precio_teorico > 0)) { patch.precio_teorico = null; patch.desvio_teorico = null; }
    // 6) IV imposible (0.96%, etc.) = solver roto
    if (r._iv_ult != null && (r._iv_ult < IV_MIN || r._iv_ult > IV_MAX)) {
      patch.vol_implicita = null;
    }
    if (Object.keys(patch).length) r = { ...r, ...patch };
    // 7) Moneyness recalculada siempre que se pueda
    const mn = moneynessOf(r.strike, spot, r.tipo);
    if (mn) r.moneyness = mn;

    out.push(r);
  }

  if (droppedSyms.length) console.warn(`[sanitize] ${droppedSyms.length} filas descartadas (sin strike/tipo recuperable):`, droppedSyms.slice(0,5));
  if (rawCount) console.warn(`[sanitize] ${rawCount} filas reconstruidas desde línea cruda del feed`);

  return { rows: out, dropped: droppedSyms.length };
}

// ── DATA ───────────────────────────────────────────────────────────────────────
async function loadData() {
  if (document.hidden) return;

  try {
    const [subRes, resRes] = await Promise.allSettled([
      fjson(`${API}/api/opciones/subyacentes`),
      fjson(`${API}/api/opciones/resumen`),
    ]);

    if (subRes.status === 'fulfilled') state.subyacentes = subRes.value.data || [];
    if (resRes.status === 'fulfilled') state.resumen   = resRes.value || {};
    if (subRes.status === 'rejected' && resRes.status === 'rejected') throw new Error('Sin respuesta del servidor');

    const fecha = (subRes.status==='fulfilled' && subRes.value.fecha) || state.resumen.fecha || '—';
    const totalOps = state.subyacentes.reduce((a,s) => a + (s.calls||0) + (s.puts||0), 0);

    document.getElementById('h-fecha').textContent = fecha;
    document.getElementById('h-total').textContent = totalOps;
    document.getElementById('fecha-pill').textContent = fecha;
    const pill = document.getElementById('live-pill');
    pill.textContent = '● en vivo';
    pill.classList.add('live'); pill.classList.remove('err');
    document.getElementById('h-updated').textContent = 'Act: ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});

    buildSidebar();
    if (state.currentSuby) await loadCadena(state.currentSuby, true);
  } catch(e) {
    const pill = document.getElementById('live-pill');
    pill.textContent = '● error';
    pill.classList.remove('live'); pill.classList.add('err');
    console.error(e);
  }
}

async function loadCadena(suby, silent = false) {
  cadenaAbort?.abort();
  const ctrl = new AbortController();
  cadenaAbort = ctrl;

  const content = document.getElementById('content');
  const scrollTop = content.scrollTop;
  if (!silent) {
    content.innerHTML = '<div class="loading">Cargando cadena...</div>';
    lastCadenaJson = null;
  }

  document.querySelectorAll('.sb-btn').forEach(b => b.classList.toggle('active', b.dataset.suby === suby));

  try {
    const d = await fjson(`${API}/api/opciones/cadena?subyacente=${encodeURIComponent(suby)}`, { signal: ctrl.signal });
    if (ctrl.signal.aborted) return;

    state.currentSuby = suby;
    const { rows, dropped } = sanitizeCadena(d.data || []);
    state.cadena = rows;
    state.dropped = dropped;

    const json = JSON.stringify(state.cadena);
    const unchanged = silent && json === lastCadenaJson;
    lastCadenaJson = json;

    document.getElementById('suby-header').style.display = 'block';
    document.getElementById('controls').style.display = 'flex';

    populateVtos();          // primero el select (el header lee el filtro elegido)
    updateSubyHeader(suby);

    if (!unchanged) renderView();
    if (silent) content.scrollTop = scrollTop;
  } catch(e) {
    if (e.name === 'AbortError') return;
    showEmpty('Error cargando cadena: ' + e.message);
  }
}

function updateSubyHeader(suby) {
  const s = state.subyacentes.find(x => x.subyacente === suby) || {};
  const sample = state.cadena.find(x => x.precio_suby) || {};
  const pcRatio = state.resumen.put_call_ratio?.[suby];
  const tasa = state.cadena.find(x => x.tasa_libre != null)?.tasa_libre;

  // FIX: P/C validado, con tope, y con el color bien (alto = bearish = rojo)
  const pcValid = typeof pcRatio === 'number' && isFinite(pcRatio);
  const pcTxt = pcValid ? (pcRatio > PC_CAP ? '>' + PC_CAP : pcRatio.toFixed(2)) : null;
  const pcCls = !pcValid ? '' : pcRatio >= 1 ? 'dn' : pcRatio <= 0.7 ? 'up' : '';

  const vtoSel = document.getElementById('ctrl-vto').value;
  let diasTxt = '—';
  if (vtoSel) {
    const r = state.cadena.find(x => x.vencimiento === vtoSel && x.dias_vto != null);
    if (r) diasTxt = r.dias_vto;
  } else {
    const dv = state.cadena.map(r => r.dias_vto).filter(v => v != null);
    if (dv.length) {
      const mn = Math.min(...dv), mx = Math.max(...dv);
      diasTxt = mn === mx ? mn : `${mn}–${mx}`;
    }
  }

  document.getElementById('suby-name').textContent = suby;
  document.getElementById('suby-meta').innerHTML = `
    <div class="meta-item">Precio suby: <span class="gold">$${fmt(sample.precio_suby)}</span></div>
    <div class="meta-item">Calls: <span>${s.calls||0}</span></div>
    <div class="meta-item">Puts: <span>${s.puts||0}</span></div>
    <div class="meta-item">Vol ARS: <span>${fmtM(s.volumen_ars)}</span></div>
    <div class="meta-item">OI: <span>${fmtN(s.open_interest)}</span></div>
    ${pcTxt!=null?`<div class="meta-item">Put/Call: <span class="${pcCls}">${pcTxt}</span></div>`:''}
    <div class="meta-item">Tasa libre: <span>${tasa!=null?tasa+'%':'—'}</span></div>
    <div class="meta-item">Días vto: <span>${diasTxt}</span></div>
    ${state.dropped>0?`<div class="meta-item" title="Filas descartadas por datos inservibles (sin strike/tipo recuperable)">Inválidas ocultas: <span class="dn">${state.dropped}</span></div>`:''}
  `;
}

function populateVtos() {
  const sel = document.getElementById('ctrl-vto');
  const vtos = [...new Set(state.cadena.map(r => r.vencimiento).filter(Boolean))].sort();
  const prev = sel.value;
  sel.innerHTML = '<option value="">Todos</option>' +
    vtos.map(v => `<option value="${esc(v)}">${vtoLabel(v)}</option>`).join('');
  sel.value = vtos.includes(prev) ? prev : '';
}

// ── SIDEBAR ────────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  if (!state.subyacentes.length) {
    sb.innerHTML = '<div class="loading" style="height:200px">Sin datos</div>';
    return;
  }

  const sorted = [...state.subyacentes].sort((a,b) => b.volumen_ars - a.volumen_ars);
  const maxVol = sorted[0]?.volumen_ars || 1;

  let html = '<div class="sb-section"><div class="sb-label">Subyacentes</div>';
  for (const s of sorted) {
    const pct = Math.round(s.volumen_ars / maxVol * 100);
    html += `
      <button class="sb-btn ${s.subyacente===state.currentSuby?'active':''}" data-suby="${esc(s.subyacente)}">
        <span>${esc(s.subyacente)}</span>
        <span class="sb-vol">${fmtM(s.volumen_ars)}</span>
      </button>
      <div style="margin:0 14px 2px;height:2px;background:#1a1710;border-radius:1px">
        <div style="width:${pct}%;height:2px;background:${s.subyacente===state.currentSuby?'#C9960A':'#2a2510'};border-radius:1px"></div>
      </div>`;
  }
  html += '</div>';
  sb.innerHTML = html;
}

// ── FILTROS COMPARTIDOS ────────────────────────────────────────────────────────
function getFilteredRows() {
  const tipo = document.getElementById('ctrl-tipo').value;
  const vto  = document.getElementById('ctrl-vto').value;
  const show = document.getElementById('ctrl-show').value;

  let rows = state.cadena;
  if (tipo) rows = rows.filter(r => r.tipo === tipo);
  if (vto)  rows = rows.filter(r => r.vencimiento === vto);
  if (show === 'traded') rows = rows.filter(r => (r.volumen_ars||0) > 0);
  if (show === 'oi')     rows = rows.filter(r => (r.open_interest||0) > 0);

  // FIX: filas sin strike van al FINAL, no arriba
  const sk = r => (r.strike > 0 ? r.strike : Infinity);
  return [...rows].sort((a,b) =>
    sk(a) - sk(b) ||
    (a.tipo||'').localeCompare(b.tipo||'') ||
    (a.vencimiento||'').localeCompare(b.vencimiento||''));
}

// ── VIEWS ──────────────────────────────────────────────────────────────────────
function switchView(view, btn) {
  state.view = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderView();
}

function renderView() {
  if (state.view === 'cadena') renderCadena();
  else if (state.view === 'smile') renderSmile();
  else renderResumen();
}

function renderSmile() {
  const vto  = document.getElementById('ctrl-vto').value;
  const show = document.getElementById('ctrl-show').value;
  // Pool base IV Últ: define los puntos principales del smile
  // Usar vi_ultimo (de Veta) cuando existe; sino vol_implicita (IAMC)
  state.cadena.forEach(r => { r._iv_ult = r.vi_ultimo > 0 ? r.vi_ultimo : r._iv_ult; });
  let base = state.cadena.filter(r => r.strike > 0 && r._iv_ult > 0);
  // Pool BO: para las líneas VI Bid/Offer (incluye filas sin IV Últ)
  let baseBO = state.cadena.filter(r => r.strike > 0 && (r.vi_bid > 0 || r.vi_offer > 0));
  if (vto)   { base = base.filter(r => r.vencimiento === vto); baseBO = baseBO.filter(r => r.vencimiento === vto); }
  if (show === 'traded') { base = base.filter(r => (r.volumen_ars||0) > 0); baseBO = baseBO.filter(r => (r.volumen_ars||0) > 0); }
  if (show === 'oi')     { base = base.filter(r => (r.open_interest||0) > 0); baseBO = baseBO.filter(r => (r.open_interest||0) > 0); }
  if (!base.length) { showEmpty('Sin datos de IV para los filtros seleccionados'); return; }

  const tipoFiltro = document.getElementById('ctrl-tipo').value; // 'CALL', 'PUT' o ''
  const st = tipoFiltro === 'CALL' ? 'call' : tipoFiltro === 'PUT' ? 'put' : 'ambos';
  let rows = st === 'call' ? base.filter(r=>r.tipo==='CALL')
           : st === 'put'  ? base.filter(r=>r.tipo==='PUT')
           : base;
  if (!rows.length) rows = base;

  const calls   = base.filter(r => r.tipo==='CALL').sort((a,b)=>a.strike-b.strike);
  const puts    = base.filter(r => r.tipo==='PUT').sort((a,b)=>a.strike-b.strike);
  const callsBO = baseBO.filter(r => r.tipo==='CALL').sort((a,b)=>a.strike-b.strike);
  const putsBO  = baseBO.filter(r => r.tipo==='PUT').sort((a,b)=>a.strike-b.strike);
  const spot  = base.find(r=>r.precio_suby)?.precio_suby || 0;
  const allIV = rows.map(r=>r._iv_ult).filter(v=>v>0);
  if (!allIV.length) { showEmpty('Sin datos de IV Último para los filtros seleccionados'); return; }
  const ivMin = Math.min(...allIV), ivMax = Math.max(...allIV);
  const ivAvg = (allIV.reduce((a,b)=>a+b,0)/allIV.length).toFixed(2);
  const atmRow = spot>0 ? rows.reduce((b,r)=>r._iv_ult>0&&Math.abs(r.strike-spot)<Math.abs((b?.strike||999999)-spot)?r:b,null) : null;
  const otmP = spot>0 ? puts.filter(r=>r.strike<spot*0.95&&r._iv_ult>0).at(-1) : null;
  const otmC = spot>0 ? calls.filter(r=>r.strike>spot*1.05&&r._iv_ult>0)[0] : null;
  const skew = otmP&&otmC ? +(otmP.vol_implicita-otmC.vol_implicita).toFixed(2) : null;
  const vh = rows.map(r=>r.vol_hist_40r).find(v=>v!=null);

  document.getElementById('content').innerHTML = `
    <div style="padding:16px 20px;overflow:auto;height:100%">
      <div style="background:#12100a;border:0.5px solid #2a2510;border-radius:6px;padding:14px;margin-bottom:14px">
        <canvas id="sc" width="1200" height="390" style="width:100%;height:390px"></canvas>
        <div id="stt" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#c8c0b0;margin-top:4px;min-height:14px"></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        ${[
          ['IV Mín',ivMin.toFixed(2)+'%',''],
          ['IV Máx',ivMax.toFixed(2)+'%',''],
          ['IV Prom',ivAvg+'%','#C9960A'],
          ['IV ATM',atmRow?atmRow.vol_implicita.toFixed(2)+'%':'—','#C9960A'],
          ['Skew Put-Call',skew!=null?(skew>0?'+':'')+skew+'%':'—',skew>0?'#c0392b':skew<0?'#3ab07a':''],
          ['VH 40r',vh!=null?vh.toFixed(2)+'%':'—',''],
          ['Strikes',allIV.length,''],
          ['Spot','$'+fmt(spot),'#C9960A'],
        ].map(([l,v,c])=>`<div style="background:#0e0d0a;border:0.5px solid #2a2510;border-radius:4px;padding:8px 10px">
          <div style="font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;color:#706858;margin-bottom:3px">${l}</div>
          <div style="font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${c||'#e8e0cc'}">${v}</div>
        </div>`).join('')}
      </div>
    </div>`;

  const canvas = document.getElementById('sc');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth, H = 390;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const pad = {l:50,r:16,t:28,b:32}; // t=28 para dejar espacio a la leyenda
  const cW = W-pad.l-pad.r, cH = H-pad.t-pad.b;

  // Determinar rango Y: incluir vi_bid y vi_offer además de vol_implicita
  const showCalls = st === 'call' || st === 'ambos';
  const showPuts  = st === 'put'  || st === 'ambos';
  const visRows   = base.filter(r => (showCalls && r.tipo==='CALL') || (showPuts && r.tipo==='PUT'));
  const visRowsBO = baseBO.filter(r => (showCalls && r.tipo==='CALL') || (showPuts && r.tipo==='PUT'));
  const allYVals = [
    ...visRows.map(r=>r._iv_ult).filter(v=>v>0),
    ...visRowsBO.flatMap(r=>[r.vi_bid,r.vi_offer].filter(v=>v>0)),
  ];
  if (!allYVals.length) { showEmpty('Sin datos de IV para los filtros seleccionados'); return; }
  const yRawMin = Math.min(...allYVals), yRawMax = Math.max(...allYVals);
  const sArr = visRows.map(r=>r.strike);
  const sMin = Math.min(...sArr), sMax = Math.max(...sArr);
  const yPad = (yRawMax-yRawMin)*0.12||1;
  const yMin = yRawMin-yPad, yMax = yRawMax+yPad;
  const xs = s => pad.l + (sMax===sMin ? cW/2 : (s-sMin)/(sMax-sMin)*cW);
  const ys = v => pad.t + cH - (yMax===yMin ? cH/2 : (v-yMin)/(yMax-yMin)*cH);

  ctx.fillStyle='#12100a'; ctx.fillRect(0,0,W,H);

  // Grid Y
  for(let i=0;i<=5;i++){
    const v=yMin+(yMax-yMin)*i/5, y=ys(v);
    ctx.strokeStyle='#1a1710'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='#706858'; ctx.font='9px monospace'; ctx.textAlign='right';
    ctx.fillText(v.toFixed(1)+'%',pad.l-3,y+3);
  }
  // Grid X
  for(let i=0;i<=6;i++){
    const s=sMin+(sMax-sMin)*i/6, x=xs(s);
    ctx.strokeStyle='#1a1710'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
    ctx.fillStyle='#706858'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText('$'+Math.round(s).toLocaleString('es-AR'),x,H-pad.b+12);
  }
  // Línea ATM
  if(spot>=sMin&&spot<=sMax){
    const xa=xs(spot);
    ctx.strokeStyle='rgba(201,150,10,0.3)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(xa,pad.t); ctx.lineTo(xa,H-pad.b); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#C9960A'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText('ATM',xa,H-pad.b+22);
  }

  // Helper: dibujar una serie de puntos con línea
  function drawSerie(pts, getY, strokeCol, dotCol, dash=[]) {
    const valid = pts.filter(r=>getY(r)>0);
    if(valid.length<1) return;
    if(valid.length>=2){
      ctx.strokeStyle=strokeCol; ctx.lineWidth=1.2; ctx.setLineDash(dash);
      ctx.beginPath();
      valid.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(getY(r))):ctx.lineTo(xs(r.strike),ys(getY(r))));
      ctx.stroke(); ctx.setLineDash([]);
    }
    valid.forEach(r=>{
      const x=xs(r.strike),y=ys(getY(r));
      ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fillStyle=dotCol; ctx.fill();
    });
  }

  const soloUno = st === 'call' || st === 'put'; // Bid/Offer solo en vista individual

  if(showCalls){
    if(soloUno){
      // VI Bid calls: verde lima
      drawSerie(callsBO, r=>r.vi_bid,   'rgba(58,176,122,0.7)',  'rgba(58,176,122,0.9)',  [3,3]);
      // VI Offer calls: naranja
      drawSerie(callsBO, r=>r.vi_offer, 'rgba(192,57,43,0.7)',   'rgba(192,57,43,0.9)',   [3,3]);
    }
    // IV Últ calls — línea sólida + puntos grandes
    const cUlt = calls.filter(r=>r._iv_ult>0);
    if(cUlt.length>=2){
      ctx.strokeStyle='rgba(220,220,220,0.7)'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]);
      ctx.beginPath(); cUlt.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r._iv_ult)):ctx.lineTo(xs(r.strike),ys(r._iv_ult)));
      ctx.stroke(); ctx.setLineDash([]);
    }
    cUlt.forEach(r=>{ ctx.beginPath(); ctx.arc(xs(r.strike),ys(r._iv_ult),5,0,Math.PI*2); ctx.fillStyle='rgba(220,220,220,0.9)'; ctx.fill(); });
  }
  if(showPuts){
    if(soloUno){
      // VI Bid puts: rojo claro
      drawSerie(putsBO, r=>r.vi_bid,   'rgba(58,176,122,0.7)',  'rgba(58,176,122,0.9)',  [3,3]);
      // VI Offer puts: violeta
      drawSerie(putsBO, r=>r.vi_offer, 'rgba(192,57,43,0.7)',   'rgba(192,57,43,0.9)',   [3,3]);
    }
    const pUlt = puts.filter(r=>r._iv_ult>0);
    if(pUlt.length>=2){
      ctx.strokeStyle='rgba(201,150,10,0.7)'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]);
      ctx.beginPath(); pUlt.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r._iv_ult)):ctx.lineTo(xs(r.strike),ys(r._iv_ult)));
      ctx.stroke(); ctx.setLineDash([]);
    }
    pUlt.forEach(r=>{ ctx.beginPath(); ctx.arc(xs(r.strike),ys(r._iv_ult),5,0,Math.PI*2); ctx.fillStyle='rgba(201,150,10,0.9)'; ctx.fill(); });
  }

  // Leyenda
  let lx = pad.l;
  const ly = pad.t - 14;
  const legendItems = [];
  if(showCalls){
    legendItems.push(['CALL Últ','rgba(220,220,220,0.9)',false]);
    if(soloUno){ legendItems.push(['VI Bid','rgba(58,176,122,0.9)',true],['VI Offer','rgba(192,57,43,0.9)',true]); }
  }
  if(showPuts){
    legendItems.push(['PUT Últ','rgba(201,150,10,0.9)',false]);
    if(soloUno){ legendItems.push(['VI Bid','rgba(58,176,122,0.9)',true],['VI Offer','rgba(192,57,43,0.9)',true]); }
  }
  ctx.font='9px monospace'; ctx.textAlign='left';
  for(const [label,col,isDash] of legendItems){
    ctx.beginPath(); ctx.arc(lx+4,ly,4,0,Math.PI*2);
    ctx.fillStyle = isDash ? 'transparent' : col; ctx.fill();
    if(isDash){ ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke(); }
    ctx.fillStyle='#c8c0b0'; ctx.fillText(label, lx+12, ly+3);
    lx += ctx.measureText(label).width + 24;
  }

  // Tooltip
  canvas.onmousemove = e => {
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    let best=null, bd=20;
    visRows.forEach(r=>{
      [['vol_implicita',r._iv_ult],['vi_bid',r.vi_bid],['vi_offer',r.vi_offer]].forEach(([field,val])=>{
        if(!(val>0)) return;
        const d=Math.hypot(xs(r.strike)-mx,ys(val)-my);
        if(d<bd){bd=d;best={r,field,val};}
      });
    });
    document.getElementById('stt').innerHTML = best
      ? `<span style="color:${best.r.tipo==='CALL'?'#3ab07a':'#c0392b'}">${esc(best.r.tipo)}</span> · ${esc(best.r.symbol)} · $${fmt(best.r.strike)} · <span style="color:#706858">${best.field==='vol_implicita'?'IV Últ':best.field==='vi_bid'?'VI Bid':'VI Offer'}</span> <span style="color:#C9960A">${best.val.toFixed(2)}%</span> · Último $${fmt(best.r.ultimo_precio)} · OI ${fmtN(best.r.open_interest)}`
      : '';
  };
  canvas.onmouseleave = ()=>{ document.getElementById('stt').innerHTML=''; };

  // Zoom con rueda del mouse (eje X, centrado en el cursor)
  if(!canvas._zoomBound){
    canvas._zoomBound = true;
    canvas._zoom = { xMin: sMin, xMax: sMax };
  } else {
    canvas._zoom = { xMin: sMin, xMax: sMax };
  }
  canvas.onwheel = e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const z = canvas._zoom;
    const range = z.xMax - z.xMin;
    const factor = e.deltaY < 0 ? 0.85 : 1/0.85;
    const pivot = z.xMin + (mx - pad.l) / cW * range;
    const newRange = range * factor;
    const newMin = Math.max(sMin, pivot - (pivot - z.xMin) / range * newRange);
    const newMax = Math.min(sMax, newMin + newRange);
    canvas._zoom = { xMin: newMin, xMax: Math.min(sMax, newMax) };
    // Redibujar solo el canvas sin re-renderizar todo
    redrawSmileCanvas(canvas, ctx, dpr, W, H, pad, cW, cH,
      canvas._zoom.xMin, canvas._zoom.xMax, yMin, yMax,
      spot, sMin, sMax, showCalls, showPuts, soloUno,
      calls, puts, callsBO, putsBO, visRows, legendItems, ly);
  };
}

function redrawSmileCanvas(canvas, ctx, dpr, W, H, pad, cW, cH,
    xMin, xMax, yMinFull, yMaxFull, spot, sMin, sMax,
    showCalls, showPuts, soloUno, calls, puts, callsBO, putsBO, visRows, legendItems, ly) {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#12100a'; ctx.fillRect(0,0,W,H);
  // Recalcular rango Y con solo los puntos en el rango X visible
  const inView = r => r.strike >= xMin && r.strike <= xMax;
  const yVals = [
    ...(showCalls ? calls.filter(inView).map(r=>r._iv_ult).filter(v=>v>0) : []),
    ...(showPuts  ? puts.filter(inView).map(r=>r._iv_ult).filter(v=>v>0)  : []),
    ...(showCalls && soloUno ? callsBO.filter(inView).flatMap(r=>[r.vi_bid,r.vi_offer].filter(v=>v>0)) : []),
    ...(showPuts  && soloUno ? putsBO.filter(inView).flatMap(r=>[r.vi_bid,r.vi_offer].filter(v=>v>0))  : []),
  ];
  const yRawMin = yVals.length ? Math.min(...yVals) : yMinFull;
  const yRawMax = yVals.length ? Math.max(...yVals) : yMaxFull;
  const yPadDyn = (yRawMax - yRawMin) * 0.12 || 1;
  const yMin = yRawMin - yPadDyn;
  const yMax = yRawMax + yPadDyn;
  const xs = s => pad.l + (xMax===xMin ? cW/2 : (s-xMin)/(xMax-xMin)*cW);
  const ys = v => pad.t + cH - (yMax===yMin ? cH/2 : (v-yMin)/(yMax-yMin)*cH);
  // Grid Y
  for(let i=0;i<=5;i++){
    const v=yMin+(yMax-yMin)*i/5, y=ys(v);
    ctx.strokeStyle='#1a1710'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='#706858'; ctx.font='9px monospace'; ctx.textAlign='right';
    ctx.fillText(v.toFixed(1)+'%',pad.l-3,y+3);
  }
  // Grid X
  for(let i=0;i<=6;i++){
    const s=xMin+(xMax-xMin)*i/6, x=xs(s);
    ctx.strokeStyle='#1a1710'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
    ctx.fillStyle='#706858'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText('$'+Math.round(s).toLocaleString('es-AR'),x,H-pad.b+12);
  }
  // ATM
  if(spot>=xMin&&spot<=xMax){
    const xa=xs(spot);
    ctx.strokeStyle='rgba(201,150,10,0.3)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(xa,pad.t); ctx.lineTo(xa,H-pad.b); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#C9960A'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText('ATM',xa,H-pad.b+22);
  }
  function drawS(pts, getY, strokeCol, dotCol, dash=[]) {
    const valid = pts.filter(r=>getY(r)>0&&r.strike>=xMin&&r.strike<=xMax);
    if(!valid.length) return;
    if(valid.length>=2){
      ctx.strokeStyle=strokeCol; ctx.lineWidth=1.2; ctx.setLineDash(dash);
      ctx.beginPath(); valid.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(getY(r))):ctx.lineTo(xs(r.strike),ys(getY(r))));
      ctx.stroke(); ctx.setLineDash([]);
    }
    valid.forEach(r=>{ ctx.beginPath(); ctx.arc(xs(r.strike),ys(getY(r)),3,0,Math.PI*2); ctx.fillStyle=dotCol; ctx.fill(); });
  }
  if(showCalls){
    if(soloUno){
      drawS(callsBO,r=>r.vi_bid,'rgba(58,176,122,0.7)','rgba(58,176,122,0.9)',[3,3]);
      drawS(callsBO,r=>r.vi_offer,'rgba(192,57,43,0.7)','rgba(192,57,43,0.9)',[3,3]);
    }
    const cUlt=calls.filter(r=>r._iv_ult>0&&r.strike>=xMin&&r.strike<=xMax);
    if(cUlt.length>=2){ ctx.strokeStyle='rgba(220,220,220,0.7)'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]); ctx.beginPath(); cUlt.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r._iv_ult)):ctx.lineTo(xs(r.strike),ys(r._iv_ult))); ctx.stroke(); ctx.setLineDash([]); }
    cUlt.forEach(r=>{ ctx.beginPath(); ctx.arc(xs(r.strike),ys(r._iv_ult),5,0,Math.PI*2); ctx.fillStyle='rgba(220,220,220,0.9)'; ctx.fill(); });
  }
  if(showPuts){
    if(soloUno){
      drawS(putsBO,r=>r.vi_bid,'rgba(58,176,122,0.7)','rgba(58,176,122,0.9)',[3,3]);
      drawS(putsBO,r=>r.vi_offer,'rgba(192,57,43,0.7)','rgba(192,57,43,0.9)',[3,3]);
    }
    const pUlt=puts.filter(r=>r._iv_ult>0&&r.strike>=xMin&&r.strike<=xMax);
    if(pUlt.length>=2){ ctx.strokeStyle='rgba(201,150,10,0.7)'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]); ctx.beginPath(); pUlt.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r._iv_ult)):ctx.lineTo(xs(r.strike),ys(r._iv_ult))); ctx.stroke(); ctx.setLineDash([]); }
    pUlt.forEach(r=>{ ctx.beginPath(); ctx.arc(xs(r.strike),ys(r._iv_ult),5,0,Math.PI*2); ctx.fillStyle='rgba(201,150,10,0.9)'; ctx.fill(); });
  }
  // Leyenda
  let lx=pad.l; ctx.font='9px monospace'; ctx.textAlign='left';
  for(const [label,col,isDash] of legendItems){
    ctx.beginPath(); ctx.arc(lx+4,ly,4,0,Math.PI*2);
    ctx.fillStyle=isDash?'transparent':col; ctx.fill();
    if(isDash){ ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke(); }
    ctx.fillStyle='#c8c0b0'; ctx.fillText(label,lx+12,ly+3);
    lx+=ctx.measureText(label).width+24;
  }
}


function renderCadena() {
  const rows = getFilteredRows();
  if (!rows.length) {
    showEmpty('Sin opciones para los filtros seleccionados');
    return;
  }

  let html = `<div class="cadena-wrap"><table>
    <thead><tr>
      <th>Symbol</th>
      <th class="center">Tipo</th>
      <th>Strike</th>
      <th class="center">Moneyness</th>
      <th>Bid</th>
      <th>Offer</th>
      <th>Último</th>
      <th>Últ Veta</th>
      <th>Apertura</th>
      <th>Mín</th>
      <th>Máx</th>
      <th>Var%</th>
      <th>Vol ARS</th>
      <th>Ops</th>
      <th>OI</th>
      <th>Var OI%</th>
      <th>P.Teórico</th>
      <th>Desvío</th>
      <th title="VI del bid">VI Bid</th>
      <th title="VI del offer">VI Off</th>
      <th title="VI del último operado">VI Últ</th>
      <th title="Volatilidad histórica 40 ruedas">VH%</th>
      <th title="Delta">Δ</th>
      <th title="Gamma">Γ</th>
      <th title="Theta (por día)">Θ</th>
      <th title="Vega (por 1% de IV)">Vega</th>
      <th title="Rho (por 1% de tasa)">Rho</th>
      <th>Vto</th>
    </tr></thead>
    <tbody>`;

  for (const r of rows) {
    const isATM = r.moneyness === 'ATM'; // la sanitización ya la recalculó bien
    const varCls = (r.var_prima_pct||0) >= 0 ? 'pos' : 'neg';
    const varOiCls = (r.var_oi_pct||0) >= 0 ? 'pos' : 'neg';
    const desvCls = (r.desvio_teorico||0) >= 0 ? 'pos' : 'neg';
    const mBadge = r.moneyness === 'ATM' ? 'badge-atm' : r.moneyness === 'ITM' ? 'badge-itm' : 'badge-otm';
    const tipoCls = r.tipo === 'CALL' ? 'pos' : 'neg';
    const vtoTxt = r.vencimiento ? vtoLabel(r.vencimiento) : '—';
    const symTitle = r._raw ? ('Línea cruda del feed: ' + (r.symbol_raw||'')) : r.symbol;

    html += `<tr class="${isATM?'atm':''}">
      <td><div class="sym${r._raw?' raw':''}" title="${esc(symTitle)}">${esc(r.symbol)}</div></td>
      <td class="center ${tipoCls}">${esc(r.tipo)||'—'}</td>
      <td class="gold">$${fmt(r.strike)}</td>
      <td class="center"><span class="${mBadge}">${esc(r.moneyness)||'—'}</span></td>
      <td class="pos">${r.bid!=null?'$'+fmt(r.bid):'-'}</td>
      <td class="neg">${r.ask!=null?'$'+fmt(r.ask):'-'}</td>
      <td>${r.ultimo_precio!=null?'$'+fmt(r.ultimo_precio):'-'}</td>
      <td class="pos">${r.veta_ultimo!=null?'$'+fmt(r.veta_ultimo):'-'}</td>
      <td class="muted">${r.apertura_prima!=null?'$'+fmt(r.apertura_prima):'-'}</td>
      <td class="muted">${r.min_prima!=null?'$'+fmt(r.min_prima):'-'}</td>
      <td class="muted">${r.max_prima!=null?'$'+fmt(r.max_prima):'-'}</td>
      <td class="${varCls}">${r.var_prima_pct!=null?(r.var_prima_pct>0?'+':'')+r.var_prima_pct.toFixed(2)+'%':'-'}</td>
      <td>${r.volumen_ars!=null?fmtM(r.volumen_ars):'-'}</td>
      <td>${r.cant_ops!=null?fmtN(r.cant_ops):'-'}</td>
      <td>${r.open_interest!=null?fmtN(r.open_interest):'-'}</td>
      <td class="${varOiCls}">${r.var_oi_pct!=null?(r.var_oi_pct>0?'+':'')+r.var_oi_pct.toFixed(2)+'%':'-'}</td>
      <td>${r.precio_teorico!=null?'$'+fmt(r.precio_teorico):'-'}</td>
      <td class="${desvCls}">${r.desvio_teorico!=null?(r.desvio_teorico>0?'+':'')+fmt(r.desvio_teorico):'-'}</td>
      <td class="pos">${r.vi_bid!=null?r.vi_bid.toFixed(2)+'%':'-'}</td>
      <td class="neg">${r.vi_offer!=null?r.vi_offer.toFixed(2)+'%':'-'}</td>
      <td class="gold">${r._iv_ult!=null?r._iv_ult.toFixed(2)+'%':'-'}</td>
      <td class="muted">${r.vol_hist_40r!=null?r.vol_hist_40r.toFixed(2)+'%':'-'}</td>
      <td>${r.delta!=null?r.delta.toFixed(2):'-'}</td>
      <td class="muted">${r.gamma!=null?r.gamma.toFixed(4):'-'}</td>
      <td class="${(r.theta||0)<0?'neg':''}">${r.theta!=null?r.theta.toFixed(2):'-'}</td>
      <td>${r.vega!=null?r.vega.toFixed(2):'-'}</td>
      <td class="muted">${r.rho!=null?r.rho.toFixed(2):'-'}</td>
      <td class="muted">${esc(vtoTxt)}</td>
    </tr>`;
  }

  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
}

function renderResumen() {
  const res = state.resumen;
  const rankVol = res.ranking_volumen || [];
  const rankOI  = res.ranking_oi || [];
  const pc      = res.put_call_ratio || {};
  const maxVol  = rankVol[0]?.volumen_ars || 1;
  const maxOI   = rankOI[0]?.open_interest || 1;

  let html = '<div class="resumen-grid">';

  html += `<div class="res-card">
    <div class="res-title">Ranking Volumen ARS</div>`;
  for (const r of rankVol.slice(0,15)) {
    const pct = r.volumen_ars / maxVol * 100;
    html += `<div class="res-row">
      <span class="res-suby">${esc(r.subyacente)}</span>
      <span class="res-val">${fmtM(r.volumen_ars)}</span>
    </div>
    <div class="res-bar"><div class="res-bar-fill" style="width:${pct}%"></div></div>`;
  }
  html += '</div>';

  html += `<div class="res-card">
    <div class="res-title">Ranking Open Interest</div>`;
  for (const r of rankOI.slice(0,15)) {
    const pct = r.open_interest / maxOI * 100;
    html += `<div class="res-row">
      <span class="res-suby">${esc(r.subyacente)}</span>
      <span class="res-val">${fmtN(r.open_interest)}</span>
    </div>
    <div class="res-bar"><div class="res-bar-fill" style="width:${pct}%"></div></div>`;
  }
  html += '</div>';

  const pcEntries = Object.entries(pc).filter(([,v])=>typeof v==='number'&&isFinite(v)).sort((a,b)=>b[1]-a[1]);
  if (pcEntries.length) {
    html += `<div class="res-card" style="grid-column:1/-1">
      <div class="res-title">Ratio Put/Call por Subyacente</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px">`;
    for (const [suby, ratio] of pcEntries) {
      const cls = ratio >= 1 ? 'neg' : ratio <= 0.7 ? 'pos' : '';
      const tag = ratio >= 1 ? 'Bearish' : ratio < 0.7 ? 'Bullish' : 'Neutral';
      const txt = ratio > PC_CAP ? '>' + PC_CAP : ratio.toFixed(2);
      html += `<div style="background:#0e0d0a;border:0.5px solid #2a2510;border-radius:4px;padding:8px 10px">
        <div style="font-size:12px;font-weight:600;color:#e8e0cc;margin-bottom:2px">${esc(suby)}</div>
        <div class="res-val ${cls}" style="font-size:14px">${txt}</div>
        <div style="font-size:9px;color:#706858;margin-top:2px">${tag}</div>
      </div>`;
    }
    html += '</div></div>';
  }

  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

// ── EXPORT CSV ─────────────────────────────────────────────────────────────────
function exportCsv() {
  const rows = getFilteredRows();
  if (!rows.length) return;
  const cols = ['symbol','tipo','strike','moneyness','bid','ask','ultimo_precio','veta_ultimo','apertura_prima','min_prima','max_prima','var_prima_pct','volumen_ars','cant_ops','open_interest','var_oi_pct','precio_teorico','desvio_teorico','vi_bid','vi_offer','vi_ultimo','vol_implicita','vol_hist_40r','delta','gamma','theta','vega','rho','vencimiento','dias_vto'];
  const head = ['Symbol','Tipo','Strike','Moneyness','Bid','Offer','Ultimo IAMC','Ultimo Veta','Apertura','Min','Max','Var%','Vol ARS','Ops','OI','Var OI%','P.Teorico','Desvio','VI Bid','VI Offer','VI Ult Veta','VI Ult IAMC','VH%','Delta','Gamma','Theta','Vega','Rho','Vencimiento','Dias Vto'];
  const cell = v => {
    if (v == null) return '';
    const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const csv = '\uFEFF' + [head.join(';'), ...rows.map(r => cols.map(cl => cell(r[cl])).join(';'))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cadena_${state.currentSuby}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── FORMATTERS ─────────────────────────────────────────────────────────────────
function fmt(v) {
  if (v == null) return '—';
  if (Math.abs(v) >= 1000) return v.toLocaleString('es-AR', {maximumFractionDigits:1});
  return v.toLocaleString('es-AR', {maximumFractionDigits:2});
}
function fmtM(v) {
  if (v == null) return '—';
  if (v >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (v >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(1)+'K';
  return v.toFixed(0);
}
function fmtN(v) {
  if (v == null) return '—';
  return v.toLocaleString('es-AR');
}

// ── EVENT WIRING ───────────────────────────────────────────────────────────────
function wireEvents() {
  document.getElementById('sidebar').addEventListener('click', e => {
    const btn = e.target.closest('.sb-btn');
    if (btn) loadCadena(btn.dataset.suby);
  });
  document.getElementById('ctrl-tipo').addEventListener('change', renderView);
  document.getElementById('ctrl-vto').addEventListener('change', renderView);
  document.getElementById('ctrl-show').addEventListener('change', renderView);
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.addEventListener('click', () => switchView(b.dataset.view, b)));
  document.getElementById('btn-csv').addEventListener('click', exportCsv);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadData(); });
  let rsT;
  window.addEventListener('resize', () => {
    clearTimeout(rsT);
    rsT = setTimeout(() => { if (state.view === 'smile' && state.currentSuby) renderSmile(); }, 150);
  });
}

// ── INIT ───────────────────────────────────────────────────────────────────────
async function init() {
  wireEvents();
  document.getElementById('app').style.display = 'block';
  await loadData();
  setInterval(loadData, 60000);
}

init();
</script>
