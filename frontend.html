<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merlin Options</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0d0a;color:#e8e0cc;font-family:'Syne',sans-serif;font-size:13px;min-height:100vh}

/* ── AUTH ── */
#auth-screen{display:flex;align-items:center;justify-content:center;height:100vh}
.auth-box{text-align:center;border:0.5px solid #2a2510;padding:40px 60px;border-radius:12px;background:#12100a}
.auth-box h2{color:#C9960A;font-size:20px;margin-bottom:8px}
.auth-box p{color:#a09880;font-size:12px;margin-bottom:24px}

/* ── HEADER ── */
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;border-bottom:1px solid #2a2510;background:#12100a;position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-title{color:#C9960A;font-size:1.1rem;font-weight:700;letter-spacing:.02em}
.header-pills{display:flex;gap:8px;align-items:center}
.pill{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;border:0.5px solid #2a2510;color:#c8c0b0}
.pill.live{border-color:#2d6a3e;color:#3ab07a;animation:pulse 2s infinite}
.pill.err{border-color:#7a2e26;color:#c0392b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.header-right{display:flex;gap:16px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#a09880}
.header-right .val{color:#e8e0cc;font-weight:500}
.header-right .val.up{color:#3ab07a}

/* ── MAIN LAYOUT ── */
.main{display:grid;grid-template-columns:140px 1fr;height:calc(100vh - 45px)}

/* ── SIDEBAR ── */
.sidebar{background:#12100a;border-right:1px solid #2a2510;overflow-y:auto;padding:8px 0;scrollbar-width:thin;scrollbar-color:#2a2510 transparent}
.sidebar::-webkit-scrollbar{width:3px}.sidebar::-webkit-scrollbar-thumb{background:#2a2510}
.sb-section{margin-bottom:4px}
.sb-label{padding:8px 14px 3px;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#706858;font-family:'JetBrains Mono',monospace;font-weight:600}
.sb-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 14px;background:none;border:none;border-left:2px solid transparent;color:#c8c0b0;cursor:pointer;text-align:left;font-size:12px;font-family:'Syne',sans-serif;transition:all .1s}
.sb-btn:hover{background:#1a1710;color:#e8e0cc}
.sb-btn.active{background:rgba(201,150,10,.06);color:#C9960A;border-left-color:#C9960A}
.sb-vol{font-family:'JetBrains Mono',monospace;font-size:10px;color:#706858}
.sb-btn.active .sb-vol{color:#c8c0b0}

/* ── PANEL ── */
.panel{display:flex;flex-direction:column;overflow:hidden}

/* ── SUBY HEADER ── */
.suby-header{padding:12px 20px 10px;border-bottom:1px solid #2a2510;background:#12100a;flex-shrink:0}
.suby-title{font-size:18px;font-weight:600;color:#C9960A;margin-bottom:4px}
.suby-meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.meta-item{font-family:'JetBrains Mono',monospace;font-size:11px;color:#a09880}
.meta-item span{color:#e8e0cc}
.meta-item span.up{color:#3ab07a}
.meta-item span.dn{color:#c0392b}
.meta-item span.gold{color:#C9960A;font-weight:500}

/* ── CONTROLS ── */
.controls{display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid #2a2510;background:#0e0d0a;flex-shrink:0;flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-lbl{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.8px;color:#706858}
.ctrl-select{background:#12100a;border:0.5px solid #2a2510;color:#e8e0cc;padding:4px 8px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace;outline:none;cursor:pointer}
.ctrl-select:focus{border-color:#C9960A}
.tab-btns{display:flex;gap:1px;margin-left:auto}
.tab-btn{padding:4px 14px;background:none;border:0.5px solid #2a2510;color:#a09880;cursor:pointer;font-size:11px;font-family:'Syne',sans-serif;transition:all .1s}
.tab-btn:first-child{border-radius:4px 0 0 4px}
.tab-btn:last-child{border-radius:0 4px 4px 0}
.tab-btn.active{background:#C9960A;color:#0e0d0a;border-color:#C9960A;font-weight:600}
.csv-btn{margin-left:8px;padding:4px 12px;background:none;border:0.5px solid #2a2510;color:#a09880;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;border-radius:4px;transition:all .1s}
.csv-btn:hover{border-color:#C9960A;color:#C9960A}

/* ── CADENA TABLE ── */
.content{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a2510 transparent}
.content::-webkit-scrollbar{width:4px;height:4px}.content::-webkit-scrollbar-thumb{background:#2a2510}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{position:sticky;top:0;background:#12100a;padding:6px 10px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:#706858;border-bottom:1px solid #2a2510;white-space:nowrap;z-index:5}
thead th:first-child{position:sticky;left:0;text-align:left;z-index:6}
thead th.center{text-align:center}
tbody tr{border-bottom:0.5px solid rgba(42,37,16,.5);transition:background .08s}
tbody tr:hover{background:#1a1710}
tbody tr.atm{background:rgba(201,150,10,.04)}
tbody tr.atm:hover{background:rgba(201,150,10,.08)}
td{padding:5px 10px;text-align:right;font-family:'JetBrains Mono',monospace;color:#c8c0b0;white-space:nowrap}
tbody td:first-child{position:sticky;left:0;background:#0e0d0a;z-index:4;text-align:left;color:#e8e0cc;font-weight:500}
tbody tr.atm td:first-child{background:#131109}
tbody tr:hover td:first-child{background:#1a1710}
tbody tr.atm:hover td:first-child{background:#181507}
/* FIX: el symbol no puede empujar el ancho de la columna (antes deformaba toda la tabla) */
.sym{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sym.raw{color:#a09880;font-style:italic}
td.center{text-align:center}
td.muted{color:#706858}
.badge-itm{background:rgba(58,176,122,.1);color:#3ab07a;border:0.5px solid #2d6a3e;padding:1px 5px;border-radius:3px;font-size:9px}
.badge-otm{background:rgba(90,78,42,.1);color:#a09880;border:0.5px solid #2a2510;padding:1px 5px;border-radius:3px;font-size:9px}
.badge-atm{background:rgba(201,150,10,.15);color:#C9960A;border:0.5px solid rgba(201,150,10,.3);padding:1px 5px;border-radius:3px;font-size:9px}

/* ── RESUMEN ── */
.resumen-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px}
.res-card{background:#12100a;border:0.5px solid #2a2510;border-radius:6px;padding:12px 14px}
.res-title{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:#706858;margin-bottom:8px}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:0.5px solid #1a1710}
.res-row:last-child{border-bottom:none}
.res-suby{color:#e8e0cc;font-size:12px;font-weight:500}
.res-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9960A}
.res-bar{height:3px;background:#2a2510;border-radius:2px;margin-top:3px}
.res-bar-fill{height:3px;background:#C9960A;border-radius:2px;transition:width .3s}

/* ── EMPTY / LOADING ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#706858;gap:10px;text-align:center;padding:40px}
.empty p{font-size:13px;line-height:1.6;max-width:280px}
.loading{display:flex;align-items:center;justify-content:center;height:100%;font-family:'JetBrains Mono',monospace;font-size:11px;color:#706858}

/* ── Colores genéricos ── */
.pos{color:#3ab07a}
.neg{color:#c0392b}
.gold{color:#C9960A;font-weight:600}

/* ── ESTRATEGIAS ── */
.est-layout{padding:16px 20px;overflow:auto;height:100%;display:flex;flex-direction:column;gap:14px}
.est-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#12100a;border:0.5px solid #2a2510;border-radius:6px;padding:10px 14px}
.est-toolbar .ctrl-lbl{white-space:nowrap}
.sesgo-btns{display:flex;gap:4px}
.sesgo-btn{padding:5px 12px;border:0.5px solid #2a2510;background:none;color:#a09880;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;border-radius:4px;transition:all .15s;white-space:nowrap}
.sesgo-btn:hover{border-color:#C9960A;color:#e8e0cc}
.sesgo-btn.active{font-weight:700}
.sesgo-btn[data-sesgo="very_bearish"].active{background:rgba(192,57,43,.2);border-color:#c0392b;color:#e74c3c}
.sesgo-btn[data-sesgo="bearish"].active{background:rgba(192,57,43,.1);border-color:#c0392b88;color:#e07060}
.sesgo-btn[data-sesgo="neutral"].active{background:rgba(201,150,10,.12);border-color:#C9960A;color:#C9960A}
.sesgo-btn[data-sesgo="bullish"].active{background:rgba(58,176,122,.1);border-color:#3ab07a88;color:#60c090}
.sesgo-btn[data-sesgo="very_bullish"].active{background:rgba(58,176,122,.2);border-color:#3ab07a;color:#3ab07a}
.vto-toggle{display:flex;gap:4px}
.vto-btn{padding:5px 12px;border:0.5px solid #2a2510;background:none;color:#a09880;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;border-radius:4px;transition:all .15s}
.vto-btn.active{background:rgba(201,150,10,.12);border-color:#C9960A;color:#C9960A}
.budget-input{background:#0e0d0a;border:0.5px solid #2a2510;color:#e8e0cc;padding:4px 8px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace;outline:none;width:100px}
.budget-input:focus{border-color:#C9960A}
.est-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.est-card{background:#12100a;border:0.5px solid #2a2510;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.est-card:hover{border-color:#C9960A44}
.est-card-header{display:flex;justify-content:space-between;align-items:flex-start}
.est-name{font-size:14px;font-weight:700;color:#e8e0cc}
.est-cat{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.8px;color:#706858;margin-top:2px}
.est-chance{text-align:right}
.est-chance .val{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace}
.est-chance .lbl{font-size:9px;color:#706858;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.est-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.est-metric{background:#0e0d0a;border:0.5px solid #1a1710;border-radius:4px;padding:7px 8px}
.est-metric .m-lbl{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.6px;color:#706858;margin-bottom:2px}
.est-metric .m-val{font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace}
.est-legs{display:flex;flex-direction:column;gap:3px}
.est-leg{font-size:10px;font-family:'JetBrains Mono',monospace;color:#a09880;padding:3px 6px;background:#0e0d0a;border-radius:3px;border-left:2px solid}
.est-leg.long{border-color:#3ab07a;color:#90d0b0}
.est-leg.short{border-color:#c0392b;color:#d09090}
.est-payoff-canvas{width:100%;height:120px;display:block;border-radius:4px}
.est-be{font-size:10px;font-family:'JetBrains Mono',monospace;color:#706858;text-align:center}
.est-section-title{font-size:11px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:#706858;padding:6px 0 2px;border-bottom:0.5px solid #2a2510}
.est-loading{display:flex;align-items:center;justify-content:center;height:200px;color:#706858;font-family:'JetBrains Mono',monospace;font-size:11px}

/* ── VISUALIZADOR ── */
.vis-overlay{position:fixed;inset:0;background:#0e0d0a;z-index:200;display:flex;flex-direction:column;overflow:hidden}
.vis-header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid #2a2510;background:#12100a;flex-shrink:0;flex-wrap:wrap}
.vis-back{background:none;border:0.5px solid #2a2510;color:#a09880;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace}
.vis-back:hover{border-color:#C9960A;color:#C9960A}
.vis-title{font-size:16px;font-weight:700;color:#e8e0cc}
.vis-subtitle{font-size:10px;font-family:'JetBrains Mono',monospace;color:#706858}
.vis-kpis{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.vis-kpi{text-align:right}
.vis-kpi .k-lbl{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.6px;color:#706858}
.vis-kpi .k-val{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace}
.vis-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.vis-tabs{display:flex;gap:4px;flex-shrink:0}
.vis-tab{padding:5px 14px;border:0.5px solid #2a2510;background:none;color:#a09880;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;border-radius:4px;transition:all .1s}
.vis-tab.active{background:#C9960A;color:#0e0d0a;border-color:#C9960A;font-weight:700}
.vis-heatmap{overflow:auto;border:0.5px solid #2a2510;border-radius:6px}
.vis-heatmap table{border-collapse:collapse;font-size:10px;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.vis-heatmap th{position:sticky;top:0;background:#12100a;padding:5px 8px;text-align:center;color:#706858;border-bottom:1px solid #2a2510;font-size:9px;z-index:2}
.vis-heatmap th.sticky-col{position:sticky;left:0;z-index:3;background:#12100a;text-align:right}
.vis-heatmap td{padding:3px 8px;text-align:right;border:0.5px solid #1a1710}
.vis-heatmap td.price-col{position:sticky;left:0;background:#12100a;color:#a09880;font-weight:500;z-index:1;border-right:1px solid #2a2510}
.vis-legs-detail{display:flex;gap:8px;flex-wrap:wrap}
.vis-leg-card{background:#12100a;border:0.5px solid #2a2510;border-radius:6px;padding:10px 14px;min-width:180px}
.vis-leg-card .vl-name{font-size:12px;font-weight:600;color:#e8e0cc;margin-bottom:6px}
.vis-leg-card .vl-row{display:flex;justify-content:space-between;font-size:10px;font-family:'JetBrains Mono',monospace;padding:2px 0;color:#a09880}
.vis-leg-card .vl-row span{color:#e8e0cc}

/* ── SLIDER RETORNO/CHANCE ── */
.slider-wrap{display:flex;align-items:center;gap:8px;margin-left:8px}
.slider-lbl{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
.slider-lbl.left{color:#c0392b}
.slider-lbl.right{color:#3ab07a}
input[type=range].rc-slider{-webkit-appearance:none;appearance:none;width:120px;height:4px;background:linear-gradient(to right,#c0392b,#C9960A,#3ab07a);border-radius:2px;outline:none;cursor:pointer}
input[type=range].rc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#e8e0cc;border:2px solid #C9960A;cursor:pointer}

/* ── TARGET PRICE ── */
.target-input{background:#0e0d0a;border:0.5px solid #2a2510;color:#e8e0cc;padding:4px 8px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace;outline:none;width:90px}
.target-input:focus{border-color:#C9960A}
.target-pct{font-size:10px;font-family:'JetBrains Mono',monospace;color:#706858;min-width:40px}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" style="display:none">
  <div class="auth-box">
    <h2>Merlin Options</h2>
    <p>Acceso solo para suscriptores</p>
    <p style="color:#c0392b;font-size:11px">Ingresá desde el portal Merlin Financial Group</p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header class="header">
    <div class="logo-wrap">
      <div class="logo-title">Merlin Options</div>
      <div class="header-pills">
        <div class="pill live" id="live-pill">● conectando...</div>
        <div class="pill">IAMC · BYMA</div>
        <div class="pill" id="fecha-pill" style="color:#C9960A">datos: —</div>
      </div>
    </div>
    <div class="header-right">
      <span>Fecha datos:</span><span class="val" id="h-fecha">—</span>
      <span>Opciones:</span><span class="val up" id="h-total">—</span>
      <span id="h-updated" style="font-size:9px;color:#706858"></span>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="loading" style="height:200px">Cargando...</div>
    </aside>

    <section class="panel">
      <div id="suby-header" class="suby-header" style="display:none">
        <div class="suby-title" id="suby-name">—</div>
        <div class="suby-meta" id="suby-meta"></div>
      </div>

      <div class="controls" id="controls" style="display:none">
        <div class="ctrl-group">
          <span class="ctrl-lbl">Tipo</span>
          <select class="ctrl-select" id="ctrl-tipo">
            <option value="">Todos</option>
            <option value="CALL">CALL</option>
            <option value="PUT">PUT</option>
          </select>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-lbl">Vencimiento</span>
          <select class="ctrl-select" id="ctrl-vto">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-lbl">Mostrar</span>
          <select class="ctrl-select" id="ctrl-show">
            <option value="all">Todos los strikes</option>
            <option value="traded">Solo con operaciones</option>
            <option value="oi">Con open interest</option>
          </select>
        </div>
        <div class="tab-btns">
          <button class="tab-btn active" data-view="cadena">Cadena</button>
          <button class="tab-btn" data-view="smile">IV Smile</button>
          <button class="tab-btn" data-view="estrategias">Estrategias</button>
          <button class="tab-btn" data-view="resumen">Resumen</button>
        </div>
      </div>

      <div class="content" id="content">
        <div class="empty">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M8 40 L16 24 L24 30 L32 16 L40 40" stroke="#2a2510" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p>Seleccioná un subyacente del panel izquierdo</p>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const API = 'https://web-production-2a938.up.railway.app';
const SUPABASE_URL  = 'https://zqnxkgqalhhybcnzgjfk.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxbnhrZ3FhbGhoeWJjbnpnamZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Mzk3MDEsImV4cCI6MjA5NDUxNTcwMX0.GD0RHfLGzplLhL1E-_GUHh3HXSNsZsvFi436wcm2tD4';

const ATM_TOL  = 0.01;   // ±1% del spot = ATM
const PC_CAP   = 50;     // P/C por encima de esto se muestra como ">50"
const IV_MIN   = 0.5;    // IV por debajo de esto = basura del solver → null
const IV_MAX   = 500;    // IV por encima de esto = basura → null
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// Prefijos de subyacentes conocidos (para parsear tipo/strike desde el ticker).
// Importante: SUPV termina en "V" — sin esta lista, el parser genérico lo confunde con un PUT.
const KNOWN_PREFIXES = ['GGAL','YPFD','BBAR','TXAR','METR','CRES','SUPV','BYMA','TGSU2','EDN','VIST'];

// ── HELPERS ────────────────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (typeof AbortSignal !== 'undefined' && !AbortSignal.timeout) {
  AbortSignal.timeout = ms => {
    const c = new AbortController();
    setTimeout(() => c.abort(new DOMException('Timeout','TimeoutError')), ms);
    return c.signal;
  };
}

function fjson(url, opts = {}) {
  return fetch(url, { ...opts, signal: opts.signal ?? AbortSignal.timeout(15000) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function vtoLabel(v) {
  const d = new Date(v + 'T00:00:00');
  return isNaN(d) ? v : `${MESES[d.getMonth()]} ${d.getDate()}`;
}

function showEmpty(msg) {

// ── AUTH (pendiente de integración con el portal) ─────────────────────────────
async function validarToken(token) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/validate_session`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',

// ── SANITIZACIÓN (defensas contra el feed IAMC) ────────────────────────────────
// Extrae tipo y strike desde el ticker. Convención BYMA: SUBY + C/V + strike + (OC|DI)
// Ej: YPFC9400DI → CALL 9400 · TXAV580.DI → PUT 580 · GFVC4200OC → PUT 4200
function parseTicker(sym) {
  const token = String(sym || '').trim().split(/\s+/)[0].toUpperCase();
  if (!token) return { symbol: '', tipo: null, strike: null };

  // 1) Si el token arranca con un subyacente conocido, lo que sigue es marcador+strike.
  //    (evita que "SUPVC4700OC" se interprete como PUT por la V de SUPV)
  const known = [...new Set([...KNOWN_PREFIXES, ...state.subyacentes.map(s => s.subyacente)])]
    .filter(t => token.startsWith(t))
    .sort((a,b) => b.length - a.length)[0];

  const rest = known ? token.slice(known.length) : token;
  let m = rest.match(/^\.?([CV])(\d{2,7}(?:\.\d+)?)\.?(?:OC|DI)?$/);
  if (m) return { symbol: token, tipo: m[1] === 'C' ? 'CALL' : 'PUT', strike: parseFloat(m[2]) };

  // 2) Fallback genérico: primer C/V seguido del strike al final del token
  m = token.match(/^(.+?)([CV])(\d{2,7}(?:\.\d+)?)\.?(?:OC|DI)?$/);
  if (m) return { symbol: token, tipo: m[2] === 'C' ? 'CALL' : 'PUT', strike: parseFloat(m[3]) };

  return { symbol: token, tipo: null, strike: null };
}

// Moneyness calculada localmente — el backend marca TODOS los puts como OTM
function moneynessOf(strike, spot, tipo) {
  if (!(strike > 0) || !(spot > 0) || (tipo !== 'CALL' && tipo !== 'PUT')) return null;
  const diff = (strike - spot) / spot;
  if (Math.abs(diff) < ATM_TOL) return 'ATM';
  if (tipo === 'CALL') return diff < 0 ? 'ITM' : 'OTM';
  return diff > 0 ? 'ITM' : 'OTM'; // PUT: strike > spot = ITM
}

const PRICE_FIELDS = ['ultimo_precio','apertura_prima','min_prima','max_prima','precio_teorico'];

function sanitizeCadena(rawRows) {
  const spot = rawRows.find(r => r.precio_suby > 0)?.precio_suby || 0;
  const out = [];
  const droppedSyms = [];
  let rawCount = 0;

  for (let r of rawRows) {
    // 1) El backend metió la línea cruda del feed en symbol → recuperar ticker/strike/tipo
    if (/\s/.test(String(r.symbol || '').trim())) {
      const info = parseTicker(r.symbol);
      r = {
        ...r,
        symbol: info.symbol,
        symbol_raw: String(r.symbol).trim(),
        tipo: (r.tipo === 'CALL' || r.tipo === 'PUT') ? r.tipo : info.tipo,
        strike: (r.strike > 0) ? r.strike : info.strike,
        _raw: true,
      };
      rawCount++;
    }
    // 2) Tipo ausente → deducir del ticker
    if (r.tipo !== 'CALL' && r.tipo !== 'PUT') {
      const info = parseTicker(r.symbol);
      if (!info.tipo) { droppedSyms.push(r.symbol); continue; }
      r = { ...r, tipo: info.tipo };
    }
    // 3) Strike ausente o inválido → deducir del ticker; sin strike la fila no sirve
    if (!(r.strike > 0)) {
      const info = parseTicker(r.symbol);
      if (!info.strike) { droppedSyms.push(r.symbol); continue; }
      r = { ...r, strike: info.strike };
    }
    // 4) Precios negativos → no existen primas negativas
    const patch = {};
    for (const f of PRICE_FIELDS) {
      if (r[f] != null && r[f] < 0) patch[f] = null;
    }
    // 5) Teórico $0 = solver roto → teórico y desvío no son confiables
    if (!(r.precio_teorico > 0)) { patch.precio_teorico = null; patch.desvio_teorico = null; }
    // 6) IV imposible (0.96%, etc.) = solver roto
    if (r._iv_ult != null && (r._iv_ult < IV_MIN || r._iv_ult > IV_MAX)) {
      patch.vol_implicita = null;
    }
    if (Object.keys(patch).length) r = { ...r, ...patch };
    // 7) Moneyness recalculada siempre que se pueda
    const mn = moneynessOf(r.strike, spot, r.tipo);
    if (mn) r.moneyness = mn;

    out.push(r);
  }

  if (droppedSyms.length) console.warn(`[sanitize] ${droppedSyms.length} filas descartadas (sin strike/tipo recuperable):`, droppedSyms.slice(0,5));
  if (rawCount) console.warn(`[sanitize] ${rawCount} filas reconstruidas desde línea cruda del feed`);

  return { rows: out, dropped: droppedSyms.length };
}

// ── DATA ───────────────────────────────────────────────────────────────────────
async function loadData() {
  if (document.hidden) return;

  try {
    const [subRes, resRes] = await Promise.allSettled([
      fjson(`${API}/api/opciones/subyacentes`),
      fjson(`${API}/api/opciones/resumen`),
    ]);

    if (subRes.status === 'fulfilled') state.subyacentes = subRes.value.data || [];
    if (resRes.status === 'fulfilled') state.resumen   = resRes.value || {};
    if (subRes.status === 'rejected' && resRes.status === 'rejected') throw new Error('Sin respuesta del servidor');

    const fecha = (subRes.status==='fulfilled' && subRes.value.fecha) || state.resumen.fecha || '—';
    const totalOps = state.subyacentes.reduce((a,s) => a + (s.calls||0) + (s.puts||0), 0);

    document.getElementById('h-fecha').textContent = fecha;
    document.getElementById('h-total').textContent = totalOps;
    document.getElementById('fecha-pill').textContent = 'datos: ' + fecha;
    const pill = document.getElementById('live-pill');
    pill.textContent = '● en vivo';
    pill.classList.add('live'); pill.classList.remove('err');
    document.getElementById('h-updated').textContent = 'Act: ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});

    buildSidebar();
    if (state.currentSuby) await loadCadena(state.currentSuby, true);
  } catch(e) {
    const pill = document.getElementById('live-pill');
    pill.textContent = '● error';
    pill.classList.remove('live'); pill.classList.add('err');
    console.error(e);
  }
}

async function loadCadena(suby, silent = false) {
  cadenaAbort?.abort();
  const ctrl = new AbortController();
  cadenaAbort = ctrl;

  const content = document.getElementById('content');
  const scrollTop = content.scrollTop;
  if (!silent) {
    content.innerHTML = '<div class="loading">Cargando cadena...</div>';
    lastCadenaJson = null;
  }

  document.querySelectorAll('.sb-btn').forEach(b => b.classList.toggle('active', b.dataset.suby === suby));

  try {
    const d = await fjson(`${API}/api/opciones/cadena?subyacente=${encodeURIComponent(suby)}`, { signal: ctrl.signal });
    if (ctrl.signal.aborted) return;

    state.currentSuby = suby;
    const { rows, dropped } = sanitizeCadena(d.data || []);
    state.cadena = rows;
    state.dropped = dropped;
    state.tasasRt = d.tasas_rt || {};

    const json = JSON.stringify(state.cadena);
    const unchanged = silent && json === lastCadenaJson;
    lastCadenaJson = json;

    document.getElementById('suby-header').style.display = 'block';
    document.getElementById('controls').style.display = 'flex';

    populateVtos();          // primero el select (el header lee el filtro elegido)
    updateSubyHeader(suby);

    if (!unchanged) renderView();
    if (silent) content.scrollTop = scrollTop;
  } catch(e) {
    if (e.name === 'AbortError') return;
    showEmpty('Error cargando cadena: ' + e.message);
  }
}

function updateSubyHeader(suby) {
  const s = state.subyacentes.find(x => x.subyacente === suby) || {};
  const sample = state.cadena.find(x => x.precio_suby) || {};
  const pcRatio = state.resumen.put_call_ratio?.[suby];
  const tasa = state.cadena.find(x => x.tasa_libre != null)?.tasa_libre;

  // FIX: P/C validado, con tope, y con el color bien (alto = bearish = rojo)
  const pcValid = typeof pcRatio === 'number' && isFinite(pcRatio);
  const pcTxt = pcValid ? (pcRatio > PC_CAP ? '>' + PC_CAP : pcRatio.toFixed(2)) : null;
  const pcCls = !pcValid ? '' : pcRatio >= 1 ? 'dn' : pcRatio <= 0.7 ? 'up' : '';

  const vtoSel = document.getElementById('ctrl-vto').value;
  let diasTxt = '—';
  if (vtoSel) {
    const r = state.cadena.find(x => x.vencimiento === vtoSel && x.dias_vto != null);
    if (r) diasTxt = r.dias_vto;
  } else {
    const dv = state.cadena.map(r => r.dias_vto).filter(v => v != null);
    if (dv.length) {
      const mn = Math.min(...dv), mx = Math.max(...dv);
      diasTxt = mn === mx ? mn : `${mn}–${mx}`;
    }
  }

  document.getElementById('suby-name').textContent = suby;
  document.getElementById('suby-meta').innerHTML = `
    <div class="meta-item">Precio suby: <span class="gold">$${fmt(sample.precio_suby)}</span></div>
    <div class="meta-item">Calls: <span>${s.calls||0}</span></div>
    <div class="meta-item">Puts: <span>${s.puts||0}</span></div>
    <div class="meta-item">Vol ARS: <span>${fmtM(s.volumen_ars)}</span></div>
    <div class="meta-item">OI: <span>${fmtN(s.open_interest)}</span></div>
    ${pcTxt!=null?`<div class="meta-item">Put/Call: <span class="${pcCls}">${pcTxt}</span></div>`:''}
    <div class="meta-item">Tasa libre: <span>${
      state.tasasRt?.oct != null
        ? state.tasasRt.oct.toFixed(2)+'% <small style=\"color:#C9960A\" title=\"S30O6 RT\">★</small>'
        : (tasa!=null?tasa+'%':'—')
    }</span></div>
    <div class="meta-item">Días vto: <span>${diasTxt}</span></div>
    ${state.dropped>0?`<div class="meta-item" title="Filas descartadas por datos inservibles (sin strike/tipo recuperable)">Inválidas ocultas: <span class="dn">${state.dropped}</span></div>`:''}
  `;
}

function populateVtos() {
  const sel = document.getElementById('ctrl-vto');
  const vtos = [...new Set(state.cadena.map(r => r.vencimiento).filter(Boolean))].sort();
  const prev = sel.value;
  sel.innerHTML = '<option value="">Todos</option>' +
    vtos.map(v => `<option value="${esc(v)}">${vtoLabel(v)}</option>`).join('');
  sel.value = vtos.includes(prev) ? prev : '';
}

// ── SIDEBAR ────────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  if (!state.subyacentes.length) {
    sb.innerHTML = '<div class="loading" style="height:200px">Sin datos</div>';
    return;
  }

  const sorted = [...state.subyacentes].sort((a,b) => b.volumen_ars - a.volumen_ars);
  const maxVol = sorted[0]?.volumen_ars || 1;

  let html = '<div class="sb-section"><div class="sb-label">Subyacentes</div>';
  for (const s of sorted) {
    const pct = Math.round(s.volumen_ars / maxVol * 100);
    html += `
      <button class="sb-btn ${s.subyacente===state.currentSuby?'active':''}" data-suby="${esc(s.subyacente)}">
        <span>${esc(s.subyacente)}</span>
        <span class="sb-vol">${fmtM(s.volumen_ars)}</span>
      </button>
      <div style="margin:0 14px 2px;height:2px;background:#1a1710;border-radius:1px">
        <div style="width:${pct}%;height:2px;background:${s.subyacente===state.currentSuby?'#C9960A':'#2a2510'};border-radius:1px"></div>
      </div>`;
  }
  html += '</div>';
  sb.innerHTML = html;
}

// ── FILTROS COMPARTIDOS ────────────────────────────────────────────────────────
function getFilteredRows() {
  const tipo = document.getElementById('ctrl-tipo').value;
  const vto  = document.getElementById('ctrl-vto').value;
  const show = document.getElementById('ctrl-show').value;

  let rows = state.cadena;
  if (tipo) rows = rows.filter(r => r.tipo === tipo);
  if (vto)  rows = rows.filter(r => r.vencimiento === vto);
  if (show === 'traded') rows = rows.filter(r => (r.volumen_ars||0) > 0);
  if (show === 'oi')     rows = rows.filter(r => (r.open_interest||0) > 0);

  // FIX: filas sin strike van al FINAL, no arriba
  const sk = r => (r.strike > 0 ? r.strike : Infinity);
  return [...rows].sort((a,b) =>
    sk(a) - sk(b) ||
    (a.tipo||'').localeCompare(b.tipo||'') ||
    (a.vencimiento||'').localeCompare(b.vencimiento||''));
}

// ── VIEWS ──────────────────────────────────────────────────────────────────────
function switchView(view, btn) {
  state.view = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderView();
}

function renderView() {
  if (state.view === 'cadena') renderCadena();
  else if (state.view === 'smile') renderSmile();
  else if (state.view === 'estrategias') renderEstrategias();
  else renderResumen();
}

function renderSmile() {
  const vto  = document.getElementById('ctrl-vto').value;
  const show = document.getElementById('ctrl-show').value;
  const tipoFiltro = document.getElementById('ctrl-tipo').value;
  const st = tipoFiltro === 'CALL' ? 'call' : tipoFiltro === 'PUT' ? 'put' : 'ambos';

  // Clave de contexto — resetea zoom solo si cambia suby/vto/tipo
  const zoomKey = (state.currentSuby||'') + '|' + vto + '|' + st;

  // Pools de datos
  state.cadena.forEach(r => { r._iv_ult = (r.vi_ultimo > 0 ? r.vi_ultimo : r.vol_implicita) || null; });
  // Excluir opciones sin valor temporal (muy ITM, precio viejo)
  let base = state.cadena.filter(r => r.strike > 0 && r._iv_ult > 0
    && (r.valor_temporal == null || r.valor_temporal > 0)
    && r._iv_ult < 250);
  let baseBO = state.cadena.filter(r => r.strike > 0 && (r.vi_bid > 0 || r.vi_offer > 0));
  if (vto)   { base = base.filter(r => r.vencimiento === vto); baseBO = baseBO.filter(r => r.vencimiento === vto); }
  if (show === 'traded') { base = base.filter(r => (r.volumen_ars||0) > 0); baseBO = baseBO.filter(r => (r.volumen_ars||0) > 0); }
  if (show === 'oi')     { base = base.filter(r => (r.open_interest||0) > 0); baseBO = baseBO.filter(r => (r.open_interest||0) > 0); }
  if (!base.length) { showEmpty('Sin datos de IV para los filtros seleccionados'); return; }

  let rows = st === 'call' ? base.filter(r=>r.tipo==='CALL')
           : st === 'put'  ? base.filter(r=>r.tipo==='PUT')
           : base;
  if (!rows.length) rows = base;

  const calls   = base.filter(r => r.tipo==='CALL').sort((a,b)=>a.strike-b.strike);
  const puts    = base.filter(r => r.tipo==='PUT').sort((a,b)=>a.strike-b.strike);
  const callsBO = baseBO.filter(r => r.tipo==='CALL').sort((a,b)=>a.strike-b.strike);
  const putsBO  = baseBO.filter(r => r.tipo==='PUT').sort((a,b)=>a.strike-b.strike);
  const spot    = base.find(r=>r.precio_suby)?.precio_suby || 0;
  const allIV   = rows.map(r=>r._iv_ult).filter(v=>v>0);
  if (!allIV.length) { showEmpty('Sin datos de IV Último para los filtros seleccionados'); return; }

  const ivMin = Math.min(...allIV), ivMax = Math.max(...allIV);
  const ivAvg = (allIV.reduce((a,b)=>a+b,0)/allIV.length).toFixed(2);
  const atmRow = spot>0 ? rows.reduce((b,r)=>r._iv_ult>0&&Math.abs(r.strike-spot)<Math.abs((b?.strike||999999)-spot)?r:b,null) : null;
  const otmP = spot>0 ? puts.filter(r=>r.strike<spot*0.95&&r._iv_ult>0).at(-1) : null;
  const otmC = spot>0 ? calls.filter(r=>r.strike>spot*1.05&&r._iv_ult>0)[0] : null;
  const skew = otmP&&otmC ? +(otmP._iv_ult-otmC._iv_ult).toFixed(2) : null;
  const vh = rows.map(r=>r.vol_hist_40r).find(v=>v!=null);

  const showCalls = st === 'call' || st === 'ambos';
  const showPuts  = st === 'put'  || st === 'ambos';
  const soloUno   = st === 'call' || st === 'put';
  const visRows   = base.filter(r => (showCalls && r.tipo==='CALL') || (showPuts && r.tipo==='PUT'));
  const visRowsBO = baseBO.filter(r => (showCalls && r.tipo==='CALL') || (showPuts && r.tipo==='PUT'));

  // Rango Y global (todos los puntos)
  const allYVals = [
    ...visRows.map(r=>r._iv_ult).filter(v=>v>0),
    ...visRowsBO.flatMap(r=>[r.vi_bid,r.vi_offer].filter(v=>v>0)),
  ];
  if (!allYVals.length) { showEmpty('Sin datos de IV para los filtros seleccionados'); return; }
  const yRawMin = Math.min(...allYVals), yRawMax = Math.max(...allYVals);
  const sArr = visRows.map(r=>r.strike);
  const sMin = Math.min(...sArr), sMax = Math.max(...sArr);
  const yPad = (yRawMax-yRawMin)*0.03||0.5;
  const yMin = yRawMin-yPad, yMax = yRawMax+yPad;

  // Leyenda (necesaria antes del early-redraw)
  const legendItems = [];
  if(showCalls){
    legendItems.push(['Call Oper','rgba(220,220,220,0.9)',false],['Call IAMC','rgba(180,130,255,0.9)',false],['Call Teór','rgba(255,140,0,0.9)',true]);
    if(soloUno){ legendItems.push(['VI Bid','rgba(58,176,122,0.9)',true],['VI Offer','rgba(192,57,43,0.9)',true]); }
  }
  if(showPuts){
    legendItems.push(['Put Oper','rgba(220,220,0,0.95)',false],['Put IAMC','rgba(255,160,50,0.9)',false],['Put Teór','rgba(255,140,0,0.9)',true]);
    if(soloUno){ legendItems.push(['VI Bid','rgba(58,176,122,0.9)',true],['VI Offer','rgba(192,57,43,0.9)',true]); }
  }

  // Zoom: preservar si la key es la misma, resetear si cambió
  if (!state._smileZoom || state._smileZoomKey !== zoomKey) {
    const sRange = sMax - sMin || 1;
    state._smileZoom = { xMin: sMin - sRange*0.03, xMax: sMax + sRange*0.03 };
    state._smileZoomKey = zoomKey;
  }

  // Rebuild DOM solo si no existe el canvas
  const existingCanvas = document.getElementById('sc');
  if (!existingCanvas) {
    document.getElementById('content').innerHTML = `
      <div style="padding:16px 20px;overflow:auto;height:100%">
        <div style="background:#12100a;border:0.5px solid #2a2510;border-radius:6px;padding:14px;margin-bottom:14px">
          <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
          <span style="font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:#706858;margin-right:4px">Curvas</span>
          <button id="btn-iamc" onclick="toggleCurva('iamc')" style="padding:3px 10px;border-radius:4px;font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all 0.15s"><span style="color:#b48dc8">■</span> IAMC</button>
          <button id="btn-merlin" onclick="toggleCurva('merlin')" style="padding:3px 10px;border-radius:4px;font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all 0.15s"><span style="color:#ff8c00">■</span> MERLIN ★</button>
        </div>
        <canvas id="sc" width="1200" height="507" style="width:100%;height:507px;cursor:grab"></canvas>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;min-height:14px">
            <div id="stt" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#c8c0b0"></div>
            <button onclick="resetSmileZoom()" style="padding:2px 8px;background:none;border:0.5px solid #2a2510;color:#706858;cursor:pointer;font-size:9px;font-family:'JetBrains Mono',monospace;border-radius:3px" title="Restablecer zoom">↺ zoom</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
          ${[
            ['IV Mín',ivMin.toFixed(2)+'%',''],
            ['IV Máx',ivMax.toFixed(2)+'%',''],
            ['IV Prom',ivAvg+'%','#C9960A'],
            ['IV ATM',atmRow?atmRow._iv_ult.toFixed(2)+'%':'—','#C9960A'],
            ['Skew Put-Call',skew!=null?(skew>0?'+':'')+skew+'%':'—',skew>0?'#c0392b':skew<0?'#3ab07a':''],
            ['VH 40r',vh!=null?vh.toFixed(2)+'%':'—',''],
            ['Strikes',allIV.length,''],
            ['Spot','$'+fmt(spot),'#C9960A'],
          ].map(([l,v,c])=>`<div style="background:#0e0d0a;border:0.5px solid #2a2510;border-radius:4px;padding:8px 10px">
            <div style="font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;color:#706858;margin-bottom:3px">${l}</div>
            <div style="font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${c||'#e8e0cc'}">${v}</div>
          </div>`).join('')}
        </div>
      </div>`;
  }

  // Actualizar estado de botones
  updateCurvaButtons();

  // Dibujar canvas
  const canvas = document.getElementById('sc');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth, H = 507;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const pad = {l:50,r:16,t:28,b:32};
  const cW = W-pad.l-pad.r, cH = H-pad.t-pad.b;
  const ly = pad.t - 14;

  // Función de dibujo reutilizable (usa zoom actual)
  function doDraw() {
    const z = state._smileZoom;
    redrawSmileCanvas(canvas, ctx, dpr, W, H, pad, cW, cH,
      z.xMin, z.xMax, yMin, yMax,
      spot, sMin, sMax, showCalls, showPuts, soloUno,
      calls, puts, callsBO, putsBO, visRows, legendItems, ly);
  }

  doDraw();

  // Zoom con rueda
  canvas.onwheel = e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const z = state._smileZoom;
    const range = z.xMax - z.xMin;
    const factor = e.deltaY < 0 ? 0.85 : 1/0.85;
    const pivot = z.xMin + (mx - pad.l) / cW * range;
    const newRange = Math.max((sMax-sMin)*0.05, range * factor);
    const margin = (sMax-sMin)*0.1;
    let newMin = pivot - (pivot - z.xMin) / range * newRange;
    let newMax = newMin + newRange;
    if(newMin < sMin - margin){ newMin = sMin - margin; newMax = newMin + newRange; }
    if(newMax > sMax + margin){ newMax = sMax + margin; newMin = newMax - newRange; }
    state._smileZoom = { xMin: newMin, xMax: newMax };
    doDraw();
  };

  // Pan con drag
  let dragStart = null;
  canvas.onmousedown = e => {
    dragStart = { x: e.clientX, zoom: {...state._smileZoom} };
    canvas.style.cursor = 'grabbing';
  };
  canvas.onmousemove = e => {
    if(dragStart) {
      const rect = canvas.getBoundingClientRect();
      const dx = (e.clientX - dragStart.x) * (W / rect.width);
      const range = dragStart.zoom.xMax - dragStart.zoom.xMin;
      const shift = -dx / cW * range;
      state._smileZoom = { xMin: dragStart.zoom.xMin + shift, xMax: dragStart.zoom.xMax + shift };
      doDraw();
    } else {
      // Tooltip
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);
      const my = (e.clientY - rect.top) * (H / rect.height);
      const z = state._smileZoom;
      const xsL = s => pad.l + (z.xMax===z.xMin ? cW/2 : (s-z.xMin)/(z.xMax-z.xMin)*cW);
      // yMin/yMax dinámico según visibles
      const inView = r => r.strike >= z.xMin && r.strike <= z.xMax;
      const yValsV = [...visRows.filter(inView).map(r=>r._iv_ult).filter(v=>v>0),
        ...(soloUno?visRowsBO.filter(inView).flatMap(r=>[r.vi_bid,r.vi_offer].filter(v=>v>0)):[])]
      const yrMin = yValsV.length?Math.min(...yValsV):yMin;
      const yrMax = yValsV.length?Math.max(...yValsV):yMax;
      const yp = (yrMax-yrMin)*0.03||0.5;
      const ysL = v => pad.t + cH - ((v-(yrMin-yp))/((yrMax+yp)-(yrMin-yp))*cH);
      let best=null, bd=20;
      [...visRows,...visRowsBO].forEach(r=>{
        [['_iv_ult',r._iv_ult],['vi_bid',r.vi_bid],['vi_offer',r.vi_offer]].forEach(([field,val])=>{
          if(!(val>0)) return;
          const d=Math.hypot(xsL(r.strike)-mx,ysL(val)-my);
          if(d<bd){bd=d;best={r,field,val};}
        });
      });
      document.getElementById('stt').innerHTML = best
        ? `<span style="color:${best.r.tipo==='CALL'?'#3ab07a':'#c0392b'}">${esc(best.r.tipo)}</span> · ${esc(best.r.symbol)} · $${fmt(best.r.strike)} · <span style="color:#706858">${best.field==='_iv_ult'?'IV Últ':best.field==='vi_bid'?'VI Bid':'VI Offer'}</span> <span style="color:#C9960A">${best.val.toFixed(2)}%</span> · Último $${fmt(best.r.ultimo_precio)} · OI ${fmtN(best.r.open_interest)}`
        : '';
    }
  };
  canvas.onmouseup = () => { dragStart = null; canvas.style.cursor = 'grab'; };
  canvas.onmouseleave = () => {
    dragStart = null;
    canvas.style.cursor = 'grab';
    const stt = document.getElementById('stt');
    if(stt) stt.innerHTML = '';
  };
}

// Dibuja una curva suavizada Catmull-Rom a partir de puntos {x,y}
function drawCatmullRom(ctx, pts, tension=0.5) {
  if(pts.length < 2) return;
  if(pts.length === 2){ ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[1].x,pts[1].y); return; }
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=0; i<pts.length-1; i++){
    const p0 = pts[Math.max(i-1,0)];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[Math.min(i+2,pts.length-1)];
    const cp1x = p1.x + (p2.x-p0.x)*tension/3;
    const cp1y = p1.y + (p2.y-p0.y)*tension/3;
    const cp2x = p2.x - (p3.x-p1.x)*tension/3;
    const cp2y = p2.y - (p3.y-p1.y)*tension/3;
    ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p2.x,p2.y);
  }
}

function redrawSmileCanvas(canvas, ctx, dpr, W, H, pad, cW, cH,
    xMin, xMax, yMinFull, yMaxFull, spot, sMin, sMax,
    showCalls, showPuts, soloUno, calls, puts, callsBO, putsBO, visRows, legendItems, ly) {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#12100a'; ctx.fillRect(0,0,W,H);
  // Recalcular rango Y con solo los puntos en el rango X visible
  const inView = r => r.strike >= xMin && r.strike <= xMax;
  const yVals = [
    ...(showCalls ? calls.filter(inView).map(r=>r._iv_ult).filter(v=>v>0) : []),
    ...(showPuts  ? puts.filter(inView).map(r=>r._iv_ult).filter(v=>v>0)  : []),
    ...(showCalls && soloUno ? callsBO.filter(inView).flatMap(r=>[r.vi_bid,r.vi_offer].filter(v=>v>0)) : []),
    ...(showPuts  && soloUno ? putsBO.filter(inView).flatMap(r=>[r.vi_bid,r.vi_offer].filter(v=>v>0))  : []),
  ];
  const yRawMin = yVals.length ? Math.min(...yVals) : yMinFull;
  const yRawMax = yVals.length ? Math.max(...yVals) : yMaxFull;
  const yPadDyn = (yRawMax - yRawMin) * 0.03 || 0.5;
  const yMin = yRawMin - yPadDyn;
  const yMax = yRawMax + yPadDyn;
  const xs = s => pad.l + (xMax===xMin ? cW/2 : (s-xMin)/(xMax-xMin)*cW);
  const ys = v => pad.t + cH - (yMax===yMin ? cH/2 : (v-yMin)/(yMax-yMin)*cH);

  // ── Curva IV Teórica BS (smile plano con sigma = IV ATM) ──
  // Implementación de Black-Scholes en JS para calcular IV implícita teórica
  function normCDF(x) {
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const sign = x<0?-1:1, t=1/(1+p*Math.abs(x)/Math.SQRT2);
    const y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x/2);
    return 0.5*(1+sign*y);
  }
  function bsPrice(S,K,T,r,sigma,tipo) {
    if(!S||!K||!T||!sigma||sigma<=0) return null;
    const d1=(Math.log(S/K)+(r+0.5*sigma*sigma)*T)/(sigma*Math.sqrt(T));
    const d2=d1-sigma*Math.sqrt(T);
    if(tipo==='CALL') return S*normCDF(d1)-K*Math.exp(-r*T)*normCDF(d2);
    return K*Math.exp(-r*T)*normCDF(-d2)-S*normCDF(-d1);
  }
  function calcIV(price,S,K,T,r,tipo) {
    if(!price||price<=0||!S||!K||!T) return null;
    let lo=0.001,hi=5,mid,p;
    for(let i=0;i<60;i++){
      mid=(lo+hi)/2; p=bsPrice(S,K,T,r,mid,tipo);
      if(!p) return null;
      if(Math.abs(p-price)<0.0001) return mid*100;
      p>price?hi=mid:lo=mid;
    }
    return mid*100;
  }
  // ── Curva IV Teórica: vol_implicita del IAMC por strike ──
  function drawTeoricoIAMC(pts, color) {
    const valid = pts
      .filter(r => r.vol_implicita > 0 && r.strike >= xMin && r.strike <= xMax
                && (r.valor_temporal == null || r.valor_temporal > 0)
                && r.vol_implicita < 200)
      .sort((a,b) => a.strike - b.strike);
    if(valid.length < 3) return;
    ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.setLineDash([5,3]);
    ctx.beginPath();
    drawCatmullRom(ctx, valid.map(r => ({x: xs(r.strike), y: ys(r.vol_implicita)})), 0.5);
    ctx.stroke(); ctx.setLineDash([]);
    valid.forEach(r => {
      ctx.beginPath(); ctx.arc(xs(r.strike), ys(r.vol_implicita), 2, 0, Math.PI*2);
      ctx.fillStyle = color; ctx.fill();
    });
  }

  if(state.showIAMC && showCalls) drawTeoricoIAMC(calls, 'rgba(180,130,255,0.85)');
  if(state.showIAMC && showPuts)  drawTeoricoIAMC(puts,  'rgba(180,130,255,0.85)');

  // ── Curva Merlin: suavizado sobre VI en tiempo real (vi_ultimo) ──
  function drawMerlinCurve(pts, color) {
    const valid = pts
      .filter(r => r.vi_ultimo > 0 && r.strike >= xMin && r.strike <= xMax
                && (r.valor_temporal == null || r.valor_temporal > 0)
                && r.vi_ultimo < 200)
      .sort((a,b) => a.strike - b.strike);
    if(valid.length < 3) return;
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([]);
    ctx.beginPath();
    drawCatmullRom(ctx, valid.map(r => ({x: xs(r.strike), y: ys(r.vi_ultimo)})), 0.5);
    ctx.stroke();
  }
  if(state.showMerlin && showCalls) drawMerlinCurve(calls, 'rgba(255,140,0,0.9)');
  if(state.showMerlin && showPuts)  drawMerlinCurve(puts,  'rgba(255,140,0,0.9)');

  // ── Bandas gaussianas ──
  const atmRowG = [...calls,...puts].reduce((b,r)=>r._iv_ult>0&&Math.abs(r.strike-spot)<Math.abs((b?.strike||999999)-spot)?r:b,null);
  const ivAtmG  = atmRowG ? atmRowG._iv_ult/100 : null;
  const vhArr   = [...calls,...puts].map(r=>r.vol_hist_40r).filter(v=>v>0);
  const vhFrac  = vhArr.length ? vhArr[0]/100 : null;
  const T_years = ([...calls,...puts][0]?.dias_vto||16)/365;

  function drawGaussBell(vol, strokeCol, fillCol) {
    if(!vol || !spot || spot<=0) return;
    const sqrtT = Math.sqrt(T_years);
    const sigma = spot * vol * sqrtT;
    const nPts = 120;
    const kFrom = Math.max(xMin, spot - 3.5*sigma);
    const kTo   = Math.min(xMax, spot + 3.5*sigma);
    if(kTo <= kFrom) return;
    const bellH = cH * 0.92;
    const base  = pad.t + cH;
    const pts = [];
    for(let i=0; i<=nPts; i++){
      const k = kFrom + (kTo-kFrom)*i/nPts;
      const z = (k - spot) / sigma;
      const g = Math.exp(-0.5*z*z);
      pts.push({ x: xs(k), y: base - g*bellH });
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, base);
    pts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(pts[pts.length-1].x, base);
    ctx.closePath();
    ctx.fillStyle = fillCol;
    ctx.fill();
    ctx.beginPath();
    pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 1;
    ctx.stroke();
    [-1,1].forEach(sign => {
      const kSig = spot * Math.exp(sign * vol * sqrtT);
      if(kSig>=xMin && kSig<=xMax){
        ctx.beginPath();
        ctx.moveTo(xs(kSig), base);
        ctx.lineTo(xs(kSig), base - bellH*Math.exp(-0.5));
        ctx.strokeStyle = strokeCol;
        ctx.lineWidth = 0.5;
        ctx.setLineDash([3,3]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    });
  }

  if(ivAtmG)  drawGaussBell(ivAtmG,  'rgba(201,150,10,0.4)',  'rgba(201,150,10,0.05)');


  // Grid Y
  for(let i=0;i<=5;i++){
    const v=yMin+(yMax-yMin)*i/5, y=ys(v);
    ctx.strokeStyle='#1a1710'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='#706858'; ctx.font='9px monospace'; ctx.textAlign='right';
    ctx.fillText(v.toFixed(1)+'%',pad.l-3,y+3);
  }
  // Grid X
  for(let i=0;i<=6;i++){
    const s=xMin+(xMax-xMin)*i/6, x=xs(s);
    ctx.strokeStyle='#1a1710'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
    ctx.fillStyle='#706858'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText('$'+Math.round(s).toLocaleString('es-AR'),x,H-pad.b+12);
  }
  // ATM
  if(spot>=xMin&&spot<=xMax){
    const xa=xs(spot);
    ctx.strokeStyle='rgba(201,150,10,0.3)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(xa,pad.t); ctx.lineTo(xa,H-pad.b); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#C9960A'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText('ATM',xa,H-pad.b+22);
  }
  function drawS(pts, getY, strokeCol, dotCol, dash=[], smooth=false) {
    const valid = pts.filter(r=>getY(r)>0&&r.strike>=xMin&&r.strike<=xMax);
    if(!valid.length) return;
    if(valid.length>=2){
      ctx.strokeStyle=strokeCol; ctx.lineWidth=1.2; ctx.setLineDash(dash);
      ctx.beginPath();
      if(smooth && valid.length>=3){
        drawCatmullRom(ctx, valid.map(r=>({x:xs(r.strike),y:ys(getY(r))})));
      } else {
        valid.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(getY(r))):ctx.lineTo(xs(r.strike),ys(getY(r))));
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    valid.forEach(r=>{ ctx.beginPath(); ctx.arc(xs(r.strike),ys(getY(r)),3,0,Math.PI*2); ctx.fillStyle=dotCol; ctx.fill(); });
  }
  // Orden de dibujo: líneas primero, luego puntos BO (chicos), luego puntos Últ (grandes encima)
  // Así cuando coinciden, el punto del operado envuelve al de bid/offer

  // ── Líneas ──
  if(showCalls){
    if(soloUno){
      const cBidL=callsBO.filter(r=>r.vi_bid>0&&r.strike>=xMin&&r.strike<=xMax);
      const cOffL=callsBO.filter(r=>r.vi_offer>0&&r.strike>=xMin&&r.strike<=xMax);
      if(cBidL.length>=2){ctx.strokeStyle='rgba(58,176,122,0.7)';ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.beginPath();cBidL.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r.vi_bid)):ctx.lineTo(xs(r.strike),ys(r.vi_bid)));ctx.stroke();ctx.setLineDash([]);}
      if(cOffL.length>=2){ctx.strokeStyle='rgba(192,57,43,0.7)';ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.beginPath();cOffL.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r.vi_offer)):ctx.lineTo(xs(r.strike),ys(r.vi_offer)));ctx.stroke();ctx.setLineDash([]);}
    }
    const cUlt=calls.filter(r=>r._iv_ult>0&&r.strike>=xMin&&r.strike<=xMax);
    if(cUlt.length>=2){ctx.strokeStyle='rgba(220,220,220,0.7)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();cUlt.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r._iv_ult)):ctx.lineTo(xs(r.strike),ys(r._iv_ult)));ctx.stroke();ctx.setLineDash([]);}
  }
  if(showPuts){
    if(soloUno){
      const pBidL=putsBO.filter(r=>r.vi_bid>0&&r.strike>=xMin&&r.strike<=xMax);
      const pOffL=putsBO.filter(r=>r.vi_offer>0&&r.strike>=xMin&&r.strike<=xMax);
      if(pBidL.length>=2){ctx.strokeStyle='rgba(58,176,122,0.7)';ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.beginPath();pBidL.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r.vi_bid)):ctx.lineTo(xs(r.strike),ys(r.vi_bid)));ctx.stroke();ctx.setLineDash([]);}
      if(pOffL.length>=2){ctx.strokeStyle='rgba(192,57,43,0.7)';ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.beginPath();pOffL.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r.vi_offer)):ctx.lineTo(xs(r.strike),ys(r.vi_offer)));ctx.stroke();ctx.setLineDash([]);}
    }
    const pUlt=puts.filter(r=>r._iv_ult>0&&r.strike>=xMin&&r.strike<=xMax);
    if(pUlt.length>=2){ctx.strokeStyle='rgba(201,150,10,0.7)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();pUlt.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r._iv_ult)):ctx.lineTo(xs(r.strike),ys(r._iv_ult)));ctx.stroke();ctx.setLineDash([]);}
  }

  // ── Puntos BO (radio 3, se dibujan antes) ──
  if(showCalls && soloUno){
    callsBO.filter(r=>r.strike>=xMin&&r.strike<=xMax).forEach(r=>{
      if(r.vi_bid>0){ctx.beginPath();ctx.arc(xs(r.strike),ys(r.vi_bid),3,0,Math.PI*2);ctx.fillStyle='rgba(58,176,122,0.9)';ctx.fill();}
      if(r.vi_offer>0){ctx.beginPath();ctx.arc(xs(r.strike),ys(r.vi_offer),3,0,Math.PI*2);ctx.fillStyle='rgba(192,57,43,0.9)';ctx.fill();}
    });
  }
  if(showPuts && soloUno){
    putsBO.filter(r=>r.strike>=xMin&&r.strike<=xMax).forEach(r=>{
      if(r.vi_bid>0){ctx.beginPath();ctx.arc(xs(r.strike),ys(r.vi_bid),3,0,Math.PI*2);ctx.fillStyle='rgba(58,176,122,0.9)';ctx.fill();}
      if(r.vi_offer>0){ctx.beginPath();ctx.arc(xs(r.strike),ys(r.vi_offer),3,0,Math.PI*2);ctx.fillStyle='rgba(192,57,43,0.9)';ctx.fill();}
    });
  }

  // ── Puntos Últ (radio 6 exterior + radio 3 interior de color BO si coincide) ──
  if(showCalls){
    const cUlt=calls.filter(r=>r._iv_ult>0&&r.strike>=xMin&&r.strike<=xMax);
    cUlt.forEach(r=>{
      const x=xs(r.strike),y=ys(r._iv_ult);
      // Punto exterior: blanco si operado hoy, lila si IAMC
      const cUltCol = r.vi_ultimo>0 ? 'rgba(220,220,220,0.9)' : r.iv_source==='teorico' ? 'rgba(140,140,140,0.5)' : 'rgba(180,130,255,0.9)';
      ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle=cUltCol;ctx.fill();
      // Punto interior: color BO si coincide (±0.5%), sino blanco pequeño
      const boRow=callsBO.find(b=>b.strike===r.strike);
      let innerCol='rgba(180,180,180,0.6)';
      if(boRow){
        const tol=Math.abs(r._iv_ult)*0.005+0.1;
        if(boRow.vi_bid>0&&Math.abs(boRow.vi_bid-r._iv_ult)<tol) innerCol='rgba(58,176,122,1)';
        else if(boRow.vi_offer>0&&Math.abs(boRow.vi_offer-r._iv_ult)<tol) innerCol='rgba(192,57,43,1)';
      }
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=innerCol;ctx.fill();
    });
  }
  if(showPuts){
    const pUlt=puts.filter(r=>r._iv_ult>0&&r.strike>=xMin&&r.strike<=xMax);
    pUlt.forEach(r=>{
      const x=xs(r.strike),y=ys(r._iv_ult);
      // Punto exterior: amarillo si operado hoy, naranja claro si IAMC
      const pUltCol = r.vi_ultimo>0 ? 'rgba(220,220,0,0.95)' : r.iv_source==='teorico' ? 'rgba(140,140,140,0.5)' : 'rgba(255,160,50,0.9)';
      ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle=pUltCol;ctx.fill();
      const boRow=putsBO.find(b=>b.strike===r.strike);
      let innerCol='rgba(150,110,5,0.6)';
      if(boRow){
        const tol=Math.abs(r._iv_ult)*0.005+0.1;
        if(boRow.vi_bid>0&&Math.abs(boRow.vi_bid-r._iv_ult)<tol) innerCol='rgba(58,176,122,1)';
        else if(boRow.vi_offer>0&&Math.abs(boRow.vi_offer-r._iv_ult)<tol) innerCol='rgba(192,57,43,1)';
      }
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=innerCol;ctx.fill();
    });
  }
  // Leyenda
  let lx=pad.l; ctx.font='9px monospace'; ctx.textAlign='left';
  for(const [label,col,isDash] of legendItems){
    ctx.beginPath(); ctx.arc(lx+4,ly,4,0,Math.PI*2);
    ctx.fillStyle=isDash?'transparent':col; ctx.fill();
    if(isDash){ ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke(); }
    ctx.fillStyle='#c8c0b0'; ctx.fillText(label,lx+12,ly+3);
    lx+=ctx.measureText(label).width+24;
  }
}


function renderCadena() {
  const rows = getFilteredRows();
  if (!rows.length) {
    showEmpty('Sin opciones para los filtros seleccionados');
    return;
  }

  let html = `<div class="cadena-wrap"><table>

  let html = '<div class="resumen-grid">';

  }
  html += '</div>';

  const pcEntries = Object.entries(pc).filter(([,v])=>typeof v==='number'&&isFinite(v)).sort((a,b)=>b[1]-a[1]);
  if (pcEntries.length) {
    html += `<div class="res-card" style="grid-column:1/-1">

async function loadEstrategias() {
  if (!state.currentSuby) return;
  EST_STATE.loading = true;
  document.getElementById('content').innerHTML = '<div class="est-loading">Calculando estrategias...</div>';

  const params = new URLSearchParams({ subyacente: state.currentSuby, sesgo: EST_STATE.sesgo });
  if (EST_STATE.vto)    params.set('vencimiento', EST_STATE.vto);
  if (EST_STATE.budget) params.set('budget', EST_STATE.budget);

  try {
    const d = await fjson(`${API}/api/estrategias?${params}`);
    EST_STATE.data    = d;
    EST_STATE.loading = false;
    renderEstrategias();
  } catch(e) {
    EST_STATE.loading = false;
    document.getElementById('content').innerHTML = `<div class="est-loading">Error: ${esc(e.message)}</div>`;
  }
}

function _scoreStrats(strats) {
  // rcWeight: 0=solo retorno, 100=solo chance
  const w = EST_STATE.rcWeight / 100;
  return [...strats].sort((a, b) => {
    const retA = a.max_profit && a.max_risk ? Math.abs(a.max_profit / a.max_risk) : 0;
    const retB = b.max_profit && b.max_risk ? Math.abs(b.max_profit / b.max_risk) : 0;
    const chA  = a.chance || 0;
    const chB  = b.chance || 0;
    const scoreA = (1 - w) * retA * 10 + w * chA;
    const scoreB = (1 - w) * retB * 10 + w * chB;
    return scoreB - scoreA;
  });
}

  const estrategias = data.estrategias || {};

// ── VISUALIZADOR ──────────────────────────────────────────────────────────────

function _bsPrice(S, K, T, r, sigma, tipo) {
  if (T <= 0 || sigma <= 0) return tipo==='CALL' ? Math.max(0,S-K) : Math.max(0,K-S);
  const d1 = (Math.log(S/K) + (r + 0.5*sigma*sigma)*T) / (sigma*Math.sqrt(T));
  const d2 = d1 - sigma*Math.sqrt(T);
  const N  = x => { const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const sign=x<0?-1:1,t=1/(1+p*Math.abs(x)); const y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x); return 0.5*(1+sign*y); };
  if (tipo==='CALL') return S*N(d1) - K*Math.exp(-r*T)*N(d2);
  return K*Math.exp(-r*T)*N(-d2) - S*N(-d1);
}

function _stratPnlAtST(legs, S, T_now, r, spot) {
  // PnL de la estrategia con T días restantes: usa BS para valorar cada pata
  let pnl = 0;
  for (const l of legs) {
    const vi   = (l.vi || 60) / 100;
    const K    = l.strike;
    const prima = l.prima;
    const val  = T_now > 0 ? _bsPrice(S, K, T_now, r, vi, l.tipo) : Math.max(0, l.tipo==='CALL'?S-K:K-S);
    pnl += l.side==='long' ? (val - prima) : (prima - val);
  }
  return pnl;
}

function _renderVisualizador(s) {
  const el = document.getElementById('content');
  const lotes  = EST_STATE.budget || 1;
  const vto    = s._vto;
  const dias   = s.dias_vto || 16;
  const spot   = s.spot || 0;
  const r      = 0.23;

  // Fechas del heatmap: hoy + intervalos hasta vencimiento
  const today = new Date();
  const vtoDate = vto === '2026-10-16' ? new Date('2026-10-16') : new Date('2026-12-18');
  const totalDias = Math.max(1, Math.round((vtoDate - today) / 86400000));

  // Columnas de tiempo (máx 8)
  const nCols = Math.min(8, totalDias);
  const colDays = [];
  for (let i = 0; i <= nCols; i++) {
    const d = Math.round(totalDias * (1 - i / nCols));
    colDays.push(d);
  }

  // Rango de precios (filas): spot ±15% en 15 pasos
  const nRows = 15;
  const prices = [];
  for (let i = nRows; i >= -nRows; i--) {
    prices.push(Math.round(spot * (1 + i * 0.01) / 10) * 10);
  }

  // Calcular P&L para cada celda
  function cellPnl(S, daysLeft) {
    const T = daysLeft / 365;
    return _stratPnlAtST(s.legs, S, T, r, spot);
  }

  // KPIs
  const costoLote = (s.costo_lote != null ? s.costo_lote : s.costo_neto * 100);
  const esDébito  = costoLote >= 0;
  const beList    = s.break_evens?.length ? s.break_evens.map(b => '$'+fmt(b)).join(' / ') : '—';

  // Tabs
  const tabs = [
    { id: 'pnl',     l: 'P&L $'       },
    { id: 'pct',     l: 'P&L %'       },
    { id: 'maxrisk', l: '% Max Risk'  },
  ];

  el.innerHTML = `
  <div class="vis-overlay" id="vis-overlay">
    <div class="vis-header">
      <button class="vis-back" id="vis-back">← Volver</button>
      <div>
        <div class="vis-title">${esc(s.nombre)}</div>
        <div class="vis-subtitle">${esc(s.subyacente)} · ${vto==='2026-10-16'?'Octubre':'Diciembre'} · ${dias} días · ${CAT_LABEL[s.categoria]||s.categoria}</div>
      </div>
      <div class="vis-kpis">
        <div class="vis-kpi">
          <div class="k-lbl">${esDébito?'Net Débito':'Net Crédito'}</div>
          <div class="k-val" style="color:${esDébito?'#c0392b':'#3ab07a'}">$${fmt(Math.abs(costoLote))}/lote</div>
        </div>
        <div class="vis-kpi">
          <div class="k-lbl">Max Profit</div>
          <div class="k-val pos">${!s.max_profit||s.max_profit>1e7?'Ilimitado':'$'+fmt(s.max_profit)}</div>
        </div>
        <div class="vis-kpi">
          <div class="k-lbl">Max Loss</div>
          <div class="k-val neg">${!s.max_risk||s.max_risk<-1e7?'Ilimitado':'$'+fmt(Math.abs(s.max_risk))}</div>
        </div>
        <div class="vis-kpi">
          <div class="k-lbl">Chance</div>
          <div class="k-val" style="color:${s.chance>=60?'#3ab07a':s.chance>=40?'#C9960A':'#c0392b'}">${s.chance!=null?s.chance.toFixed(1)+'%':'—'}</div>
        </div>
        <div class="vis-kpi">
          <div class="k-lbl">Break-even</div>
          <div class="k-val gold">${beList}</div>
        </div>
        <div class="vis-kpi">
          <div class="k-lbl">Lotes</div>
          <div class="k-val">${lotes}</div>
        </div>
      </div>
    </div>
    <div class="vis-body">
      <div class="vis-tabs">
        ${tabs.map(t => `<button class="vis-tab${EST_STATE.visTab===t.id?' active':''}" data-tab="${t.id}">${t.l}</button>`).join('')}
      </div>
      <div class="vis-legs-detail">
        ${(s.legs||[]).map(l => `
        <div class="vis-leg-card">
          <div class="vl-name" style="color:${l.side==='long'?'#3ab07a':'#c0392b'}">${l.side==='long'?'▲ COMPRA':'▼ VENTA'} ${l.tipo}</div>
          <div class="vl-row">Strike <span>$${fmt(l.strike)}</span></div>
          <div class="vl-row">Prima <span>$${fmt(l.prima)}/acc · $${fmt(l.prima*100)}/lote</span></div>
          ${l.bid&&l.ask?`<div class="vl-row">Bid/Ask <span>$${fmt(l.bid)} / $${fmt(l.ask)}</span></div>`:''}
        </div>`).join('')}
      </div>
      <div class="vis-heatmap" id="vis-heatmap">
        ${_buildHeatmap(prices, colDays, cellPnl, s, lotes, EST_STATE.visTab)}
      </div>
    </div>
  </div>`;

  document.getElementById('vis-back').addEventListener('click', () => {
    EST_STATE.visStrat = null;
    renderEstrategias();
    requestAnimationFrame(() => _drawAllPayoffs(EST_STATE.data));
  });

  document.querySelector('.vis-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.vis-tab');
    if (!btn) return;
    EST_STATE.visTab = btn.dataset.tab;
    document.querySelectorAll('.vis-tab').forEach(b => b.classList.toggle('active', b===btn));
    document.getElementById('vis-heatmap').innerHTML = _buildHeatmap(prices, colDays, cellPnl, s, lotes, EST_STATE.visTab);
  });
}

function _buildHeatmap(prices, colDays, cellPnl, s, lotes, tab) {
  const maxLoss   = s.max_risk   || -1;
  const maxProfit = s.max_profit || 1;
  const spot      = s.spot || 0;

  function cellColor(pnl) {
    if (pnl >= 0) {
      const intensity = Math.min(1, pnl / (Math.abs(maxProfit) || 1));
      const g = Math.round(80 + 96 * intensity);
      return `rgba(30,${g},50,0.85)`;
    } else {
      const intensity = Math.min(1, Math.abs(pnl) / (Math.abs(maxLoss) || 1));
      const r = Math.round(80 + 112 * intensity);
      return `rgba(${r},30,30,0.85)`;
    }
  }

  function cellVal(pnl, S) {
    const pnlLote = pnl * 100 * lotes;
    if (tab === 'pnl')     return (pnlLote >= 0 ? '+' : '') + '$' + fmt(pnlLote);
    if (tab === 'pct') {
      const base = Math.abs(s.costo_lote || 1) * lotes || 1;
      const pct  = pnlLote / base * 100;
      return (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
    }
    if (tab === 'maxrisk') {
      const mr = Math.abs(maxLoss * 100 * lotes) || 1;
      const pct = pnlLote / mr * 100;
      return (pct >= 0 ? '+' : '') + pct.toFixed(0) + '%';
    }
    return '';
  }

  // Encabezado de columnas
  const today = new Date();
  function daysToLabel(d) {
    if (d === 0) return 'Vto';
    const dt = new Date(today.getTime() + (s.dias_vto - d) * 86400000);
    return `${dt.getDate()}/${dt.getMonth()+1}`;
  }

  let html = '<table><thead><tr>';
  html += '<th class="sticky-col">Precio</th>';
  colDays.forEach(d => { html += `<th>${daysToLabel(d)}<br><span style="color:#706858;font-size:8px">${d}d</span></th>`; });
  html += '</tr></thead><tbody>';

  for (const S of prices) {
    const isSpot = Math.abs(S - spot) / spot < 0.015;
    html += `<tr${isSpot?' style="outline:1px solid #C9960A44"':''}>`;
    html += `<td class="price-col"${isSpot?' style="color:#C9960A"':''}>${isSpot?'▶ ':''}\$${fmt(S)}</td>`;
    for (const d of colDays) {
      const pnl = cellPnl(S, d);
      const col = cellColor(pnl);
      const txt = cellVal(pnl, S);
      const txtColor = pnl >= 0 ? '#a0e0b0' : '#e0a0a0';
      html += `<td style="background:${col};color:${txtColor}">${txt}</td>`;
    }
    html += '</tr>';
  }

  html += '</tbody></table>';
  return html;
}

function _drawAllPayoffs(data) {
  const estrategias = data.estrategias || {};
  for (const [vto, strats] of Object.entries(estrategias)) {
    const sorted = _scoreStrats(strats);
    sorted.forEach((s, idx) => {
      const canvasId = `payoff-${vto.replace(/-/g,'')}-${idx}`;
      const canvas = document.getElementById(canvasId);
      if (!canvas || !s.payoff?.length) return;
      _drawPayoff(canvas, s);
    });
  }
}

function _drawPayoff(canvas, s) {
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.offsetWidth || 320;
  const H   = 120;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { l: 44, r: 8, t: 8, b: 22 };
  const cW  = W - pad.l - pad.r;
  const cH  = H - pad.t - pad.b;

  const pts   = s.payoff;
  const sVals = pts.map(p => p.s);
  const pVals = pts.map(p => p.pnl);
  const sMin  = Math.min(...sVals), sMax = Math.max(...sVals);
  const pRange = Math.max(Math.abs(Math.min(...pVals)), Math.abs(Math.max(...pVals))) || 1;

  const xs = v => pad.l + (sMax===sMin ? cW/2 : (v-sMin)/(sMax-sMin)*cW);
  const ys = v => pad.t + cH - ((v+pRange)/(2*pRange)*cH);
  const y0 = ys(0);

  ctx.fillStyle = '#0e0d0a'; ctx.fillRect(0,0,W,H);

  // Eje cero
  ctx.strokeStyle='#2a2510'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(pad.l,y0); ctx.lineTo(W-pad.r,y0); ctx.stroke();

  // Spot
  if (s.spot) {
    ctx.strokeStyle='rgba(201,150,10,0.4)'; ctx.lineWidth=0.8; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(xs(s.spot),pad.t); ctx.lineTo(xs(s.spot),H-pad.b); ctx.stroke(); ctx.setLineDash([]);
  }

  // Target price
  const tgt = EST_STATE.targetPrice;
  if (tgt && tgt >= sMin && tgt <= sMax) {
    ctx.strokeStyle='rgba(155,89,182,0.7)'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(xs(tgt),pad.t); ctx.lineTo(xs(tgt),H-pad.b); ctx.stroke(); ctx.setLineDash([]);
    // Punto en la curva
    const tgtPnl = pts.reduce((b,p)=>Math.abs(p.s-tgt)<Math.abs(b.s-tgt)?p:b).pnl;
    ctx.beginPath(); ctx.arc(xs(tgt),ys(tgtPnl),4,0,Math.PI*2);
    ctx.fillStyle='rgba(155,89,182,0.9)'; ctx.fill();
  }

  // Break-evens
  (s.break_evens||[]).forEach(be => {
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=0.6; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(xs(be),pad.t); ctx.lineTo(xs(be),H-pad.b); ctx.stroke(); ctx.setLineDash([]);
  });

  // Fill
  ctx.beginPath(); ctx.moveTo(xs(pts[0].s),y0);
  pts.forEach(p=>ctx.lineTo(xs(p.s),ys(p.pnl)));
  ctx.lineTo(xs(pts[pts.length-1].s),y0); ctx.closePath();
  const grad=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
  grad.addColorStop(0,'rgba(58,176,122,0.25)'); grad.addColorStop(0.5,'rgba(58,176,122,0.05)'); grad.addColorStop(1,'rgba(192,57,43,0.20)');
  ctx.fillStyle=grad; ctx.fill();

  // Línea payoff
  ctx.beginPath();
  pts.forEach((p,i)=>{ const x=xs(p.s),y=ys(p.pnl); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle='#C9960A'; ctx.lineWidth=2; ctx.stroke();

  // Labels Y
  ctx.fillStyle='#706858'; ctx.font='8px monospace'; ctx.textAlign='right';
  [pRange,0,-pRange].forEach(v=>{
    const y=ys(v), txt=v===0?'0':(v>0?'+':'')+fmtM(v);
    ctx.fillText(txt,pad.l-3,y+3);
  });
  // Labels X
  ctx.textAlign='center';
  [sMin,s.spot||(sMin+sMax)/2,sMax].forEach(v=>{
    const lbl=v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0);
    ctx.fillText('$'+lbl,xs(v),H-pad.b+12);
  });
}


// ── EXPORT CSV ─────────────────────────────────────────────────────────────────
function exportCsv() {
  const rows = getFilteredRows();
  if (!rows.length) return;
  const cols = ['symbol','tipo','strike','moneyness','bid','ask','ultimo_precio','veta_ultimo','apertura_prima','min_prima','max_prima','var_prima_pct','volumen_ars','cant_ops','open_interest','var_oi_pct','precio_teorico','desvio_teorico','vi_bid','vi_offer','vi_ultimo','vol_implicita','vol_hist_40r','delta','gamma','theta','vega','rho','vencimiento','dias_vto'];
  const head = ['Symbol','Tipo','Strike','Moneyness','Bid','Offer','Ultimo','Ult Oper','Apertura','Min','Max','Var%','Vol ARS','Ops','OI','Var OI%','P.Teorico','Desvio','VI Bid','VI Offer','VI Ult Oper','VI Ult','VH%','Delta','Gamma','Theta','Vega','Rho','Vencimiento','Dias Vto'];
  const cell = v => {
    if (v == null) return '';
    const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const csv = '\uFEFF' + [head.join(';'), ...rows.map(r => cols.map(cl => cell(r[cl])).join(';'))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cadena_${state.currentSuby}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── FORMATTERS ─────────────────────────────────────────────────────────────────
function fmt(v) {
  if (v == null) return '—';
  if (Math.abs(v) >= 1000) return v.toLocaleString('es-AR', {maximumFractionDigits:1});
  return v.toLocaleString('es-AR', {maximumFractionDigits:2});
}
function fmtM(v) {
  if (v == null) return '—';
  if (v >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (v >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(1)+'K';
  return v.toFixed(0);
}
function fmtN(v) {
  if (v == null) return '—';
  return v.toLocaleString('es-AR');
}

// ── EVENT WIRING ───────────────────────────────────────────────────────────────
function toggleCurva(which) {
  if(which === 'iamc')   state.showIAMC   = !state.showIAMC;
  if(which === 'merlin') state.showMerlin = !state.showMerlin;
  updateCurvaButtons();
  renderSmile();
}

function updateCurvaButtons() {
  const btnI = document.getElementById('btn-iamc');
  const btnM = document.getElementById('btn-merlin');
  if(btnI) {
    btnI.style.border     = `0.5px solid ${state.showIAMC ? '#9b59b6' : '#2a2510'}`;
    btnI.style.background = state.showIAMC ? 'rgba(155,89,182,0.15)' : 'none';
    btnI.style.color      = state.showIAMC ? '#c8c0b0' : '#706858';
  }
  if(btnM) {
    btnM.style.border     = `0.5px solid ${state.showMerlin ? '#ff8c00' : '#2a2510'}`;
    btnM.style.background = state.showMerlin ? 'rgba(255,140,0,0.10)' : 'none';
    btnM.style.color      = state.showMerlin ? '#c8c0b0' : '#706858';
  }
}

function resetSmileZoom() {
  state._smileZoom = null;
  state._smileZoomKey = null;
  renderSmile();
}

function wireEvents() {
  document.getElementById('sidebar').addEventListener('click', e => {
    const btn = e.target.closest('.sb-btn');
    if (btn) loadCadena(btn.dataset.suby);
  });
  document.getElementById('ctrl-tipo').addEventListener('change', renderView);
  document.getElementById('ctrl-vto').addEventListener('change', renderView);
  document.getElementById('ctrl-show').addEventListener('change', renderView);
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.addEventListener('click', () => switchView(b.dataset.view, b)));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadData(); });
  let rsT;
  window.addEventListener('resize', () => {
    clearTimeout(rsT);
    rsT = setTimeout(() => { if (state.view === 'smile' && state.currentSuby) renderSmile(); }, 150);
  });
}

// ── INIT ───────────────────────────────────────────────────────────────────────
async function init() {
  wireEvents();
  document.getElementById('app').style.display = 'block';
  await loadData();
  setInterval(loadData, 60000);
}

init();
</script>
