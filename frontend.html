<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merlin Options</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0d0a;color:#e8e0cc;font-family:'Syne',sans-serif;font-size:13px;min-height:100vh}

/* ── AUTH ── */
#auth-screen{display:flex;align-items:center;justify-content:center;height:100vh}
.auth-box{text-align:center;border:0.5px solid #2a2510;padding:40px 60px;border-radius:12px;background:#12100a}
.auth-box h2{color:#C9960A;font-size:20px;margin-bottom:8px}
.auth-box p{color:#a09880;font-size:12px;margin-bottom:24px}

/* ── HEADER ── */
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;border-bottom:1px solid #2a2510;background:#12100a;position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-title{color:#C9960A;font-size:1.1rem;font-weight:700;letter-spacing:.02em}
.header-pills{display:flex;gap:8px;align-items:center}
.pill{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;border:0.5px solid #2a2510;color:#c8c0b0}
.pill.live{border-color:#2d6a3e;color:#3ab07a;animation:pulse 2s infinite}
.pill.err{border-color:#7a2e26;color:#c0392b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.header-right{display:flex;gap:16px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#a09880}
.header-right .val{color:#e8e0cc;font-weight:500}
.header-right .val.up{color:#3ab07a}

/* ── MAIN LAYOUT ── */
.main{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 45px)}

/* ── SIDEBAR ── */
.sidebar{background:#12100a;border-right:1px solid #2a2510;overflow-y:auto;padding:12px 0;scrollbar-width:thin;scrollbar-color:#2a2510 transparent}
.sidebar::-webkit-scrollbar{width:3px}.sidebar::-webkit-scrollbar-thumb{background:#2a2510}
.sb-section{margin-bottom:4px}
.sb-label{padding:8px 14px 3px;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#706858;font-family:'JetBrains Mono',monospace;font-weight:600}
.sb-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 14px;background:none;border:none;border-left:2px solid transparent;color:#c8c0b0;cursor:pointer;text-align:left;font-size:12px;font-family:'Syne',sans-serif;transition:all .1s}
.sb-btn:hover{background:#1a1710;color:#e8e0cc}
.sb-btn.active{background:rgba(201,150,10,.06);color:#C9960A;border-left-color:#C9960A}
.sb-vol{font-family:'JetBrains Mono',monospace;font-size:10px;color:#706858}
.sb-btn.active .sb-vol{color:#c8c0b0}

/* ── PANEL ── */
.panel{display:flex;flex-direction:column;overflow:hidden}

/* ── SUBY HEADER ── */
.suby-header{padding:12px 20px 10px;border-bottom:1px solid #2a2510;background:#12100a;flex-shrink:0}
.suby-title{font-size:18px;font-weight:600;color:#C9960A;margin-bottom:4px}
.suby-meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.meta-item{font-family:'JetBrains Mono',monospace;font-size:11px;color:#a09880}
.meta-item span{color:#e8e0cc}
.meta-item span.up{color:#3ab07a}
.meta-item span.dn{color:#c0392b}
.meta-item span.gold{color:#C9960A;font-weight:500}

/* ── CONTROLS ── */
.controls{display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid #2a2510;background:#0e0d0a;flex-shrink:0;flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-lbl{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.8px;color:#706858}
.ctrl-select{background:#12100a;border:0.5px solid #2a2510;color:#e8e0cc;padding:4px 8px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace;outline:none;cursor:pointer}
.ctrl-select:focus{border-color:#C9960A}
.tab-btns{display:flex;gap:1px;margin-left:auto}
.tab-btn{padding:4px 14px;background:none;border:0.5px solid #2a2510;color:#a09880;cursor:pointer;font-size:11px;font-family:'Syne',sans-serif;transition:all .1s}
.tab-btn:first-child{border-radius:4px 0 0 4px}
.tab-btn:last-child{border-radius:0 4px 4px 0}
.tab-btn.active{background:#C9960A;color:#0e0d0a;border-color:#C9960A;font-weight:600}
.csv-btn{margin-left:8px;padding:4px 12px;background:none;border:0.5px solid #2a2510;color:#a09880;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;border-radius:4px;transition:all .1s}
.csv-btn:hover{border-color:#C9960A;color:#C9960A}

/* ── CADENA TABLE ── */
.content{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a2510 transparent}
.content::-webkit-scrollbar{width:4px;height:4px}.content::-webkit-scrollbar-thumb{background:#2a2510}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{position:sticky;top:0;background:#12100a;padding:6px 10px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:#706858;border-bottom:1px solid #2a2510;white-space:nowrap;z-index:5}
thead th:first-child{position:sticky;left:0;text-align:left;z-index:6}
thead th.center{text-align:center}
tbody tr{border-bottom:0.5px solid rgba(42,37,16,.5);transition:background .08s}
tbody tr:hover{background:#1a1710}
tbody tr.atm{background:rgba(201,150,10,.04)}
tbody tr.atm:hover{background:rgba(201,150,10,.08)}
td{padding:5px 10px;text-align:right;font-family:'JetBrains Mono',monospace;color:#c8c0b0;white-space:nowrap}
tbody td:first-child{position:sticky;left:0;background:#0e0d0a;z-index:4;text-align:left;color:#e8e0cc;font-weight:500}
tbody tr.atm td:first-child{background:#131109}
tbody tr:hover td:first-child{background:#1a1710}
tbody tr.atm:hover td:first-child{background:#181507}
.sym{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sym.raw{color:#a09880;font-style:italic}
td.center{text-align:center}
td.muted{color:#706858}
.badge-itm{background:rgba(58,176,122,.1);color:#3ab07a;border:0.5px solid #2d6a3e;padding:1px 5px;border-radius:3px;font-size:9px}
.badge-otm{background:rgba(90,78,42,.1);color:#a09880;border:0.5px solid #2a2510;padding:1px 5px;border-radius:3px;font-size:9px}
.badge-atm{background:rgba(201,150,10,.15);color:#C9960A;border:0.5px solid rgba(201,150,10,.3);padding:1px 5px;border-radius:3px;font-size:9px}

/* ── RESUMEN ── */
.resumen-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px}
.res-card{background:#12100a;border:0.5px solid #2a2510;border-radius:6px;padding:12px 14px}
.res-title{font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:#706858;margin-bottom:8px}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:0.5px solid #1a1710}
.res-row:last-child{border-bottom:none}
.res-suby{color:#e8e0cc;font-size:12px;font-weight:500}
.res-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:#C9960A}
.res-bar{height:3px;background:#2a2510;border-radius:2px;margin-top:3px}
.res-bar-fill{height:3px;background:#C9960A;border-radius:2px;transition:width .3s}

/* ── EMPTY / LOADING ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#706858;gap:10px;text-align:center;padding:40px}
.empty p{font-size:13px;line-height:1.6;max-width:280px}
.loading{display:flex;align-items:center;justify-content:center;height:100%;font-family:'JetBrains Mono',monospace;font-size:11px;color:#706858}

/* ── Colores genéricos ── */
.pos{color:#3ab07a}
.neg{color:#c0392b}
.gold{color:#C9960A;font-weight:600}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" style="display:none">
  <div class="auth-box">
    <h2>Merlin Options</h2>
    <p>Acceso solo para suscriptores</p>
    <p style="color:#c0392b;font-size:11px">Ingresá desde el portal Merlin Financial Group</p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header class="header">
    <div class="logo-wrap">
      <div class="logo-title">Merlin Options</div>
      <div class="header-pills">
        <div class="pill live" id="live-pill">● conectando...</div>
        <div class="pill">IAMC · BYMA</div>
        <div class="pill" id="fecha-pill" style="color:#C9960A">datos: —</div>
      </div>
    </div>
    <div class="header-right">
      <span>Fecha datos:</span><span class="val" id="h-fecha">—</span>
      <span>Opciones:</span><span class="val up" id="h-total">—</span>
      <span id="h-updated" style="font-size:9px;color:#706858"></span>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="loading" style="height:200px">Cargando...</div>
    </aside>

    <section class="panel">
      <div id="suby-header" class="suby-header" style="display:none">
        <div class="suby-title" id="suby-name">—</div>
        <div class="suby-meta" id="suby-meta"></div>
      </div>

      <div class="controls" id="controls" style="display:none">
        <div class="ctrl-group">
          <span class="ctrl-lbl">Tipo</span>
          <select class="ctrl-select" id="ctrl-tipo">
            <option value="">Todos</option>
            <option value="CALL">CALL</option>
            <option value="PUT">PUT</option>
          </select>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-lbl">Vencimiento</span>
          <select class="ctrl-select" id="ctrl-vto">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-lbl">Mostrar</span>
          <select class="ctrl-select" id="ctrl-show">
            <option value="all">Todos los strikes</option>
            <option value="traded">Solo con operaciones</option>
            <option value="oi">Con open interest</option>
          </select>
        </div>
        <div class="tab-btns">
          <button class="tab-btn active" data-view="cadena">Cadena</button>
          <button class="tab-btn" data-view="smile">IV Smile</button>
          <button class="tab-btn" data-view="resumen">Resumen</button>
        </div>
        <button class="csv-btn" id="btn-csv" title="Exportar cadena filtrada a CSV">CSV</button>
      </div>

      <div class="content" id="content">
        <div class="empty">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M8 40 L16 24 L24 30 L32 16 L40 40" stroke="#2a2510" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p>Seleccioná un subyacente del panel izquierdo</p>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const API = 'https://web-production-2a938.up.railway.app';
const SUPABASE_URL  = 'https://zqnxkgqalhhybcnzgjfk.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxbnhrZ3FhbGhoeWJjbnpnamZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Mzk3MDEsImV4cCI6MjA5NDUxNTcwMX0.GD0RHfLGzplLhL1E-_GUHh3HXSNsZsvFi436wcm2tD4';

const ATM_TOL  = 0.01;   // ±1% del spot = ATM
const PC_CAP   = 50;     // P/C por encima de esto se muestra como ">50"
const IV_MIN   = 2.5;    // IV por debajo de esto = basura del solver → null (antes 0.5: demasiado laxo)
const IV_MAX   = 500;    // IV por encima de esto = basura → null
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// Prefijos de subyacentes conocidos (para parsear tipo/strike desde el ticker).
// Importante: SUPV termina en "V" — sin esta lista, el parser genérico lo confunde con un PUT.
const KNOWN_PREFIXES = ['GGAL','YPFD','BBAR','TXAR','METR','CRES','SUPV','BYMA','TGSU2','EDN','VIST'];

// ── HELPERS ────────────────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(x)  { return (x == null || !isFinite(x)) ? '—' : Number(x).toLocaleString('es-AR',{maximumFractionDigits:2}); }
function fmtN(x) { return (x == null || !isFinite(x)) ? '—' : Math.round(x).toLocaleString('es-AR'); }
function fmtM(x) {
  if (x == null || !isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a >= 1e12) return (x/1e12).toFixed(2)+'T';
  if (a >= 1e9)  return (x/1e9).toFixed(2)+'B';
  if (a >= 1e6)  return (x/1e6).toFixed(2)+'M';
  if (a >= 1e3)  return (x/1e3).toFixed(1)+'K';
  return String(Math.round(x));
}

// Percentil p (0..1) de un array numérico
function pctl(arr, p) {
  const s = [...arr].sort((a,b)=>a-b);
  const i = (s.length - 1) * p;
  const lo = Math.floor(i), hi = Math.ceil(i);
  return s[lo] + (s[hi] - s[lo]) * (i - lo);
}
const median = a => pctl(a, 0.5);

if (typeof AbortSignal !== 'undefined' && !AbortSignal.timeout) {
  AbortSignal.timeout = ms => {
    const c = new AbortController();
    setTimeout(() => c.abort(new DOMException('Timeout','TimeoutError')), ms);
    return c.signal;
  };
}

function fjson(url, opts = {}) {
  return fetch(url, { ...opts, signal: opts.signal ?? AbortSignal.timeout(15000) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function vtoLabel(v) {
  const d = new Date(v + 'T00:00:00');
  return isNaN(d) ? v : `${MESES[d.getMonth()]} ${d.getDate()}`;
}

function showEmpty(msg) {
  const el = document.getElementById('content');
  el.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'empty';
  const p = document.createElement('p');
  p.textContent = msg;
  div.appendChild(p);
  el.appendChild(div);
}

// ── STATE ──────────────────────────────────────────────────────────────────────
let state = {
  subyacentes: [],
  cadena: [],
  resumen: {},
  currentSuby: null,
  view: 'cadena',
  dropped: 0,
  _smileZoom: null, _smileZoomKey: null,
  _smileRange: null, _smileY: null, _smileRedraw: null,
};
let cadenaAbort = null;
let lastCadenaJson = null;

// ── AUTH (pendiente de integración con el portal) ─────────────────────────────
async function validarToken(token) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/validate_session`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': 'Bearer ' + SUPABASE_ANON,
      },
      body: JSON.stringify({ p_token: token }),
      signal: AbortSignal.timeout(5000),
    });
    if (!r.ok) return false;
    return await r.json() === true;
  } catch(e) {
    return false;
  }
}

// ── SANITIZACIÓN (defensas contra el feed IAMC) ────────────────────────────────
// Extrae tipo y strike desde el ticker. Convención BYMA: SUBY + C/V + strike + (OC|DI)
// Ej: YPFC9400DI → CALL 9400 · TXAV580.DI → PUT 580 · GFVC4200OC → PUT 4200
function parseTicker(sym) {
  const token = String(sym || '').trim().split(/\s+/)[0].toUpperCase();
  if (!token) return { symbol: '', tipo: null, strike: null };

  const known = [...new Set([...KNOWN_PREFIXES, ...state.subyacentes.map(s => s.subyacente)])]
    .filter(t => token.startsWith(t))
    .sort((a,b) => b.length - a.length)[0];

  const rest = known ? token.slice(known.length) : token;
  let m = rest.match(/^\.?([CV])(\d{2,7}(?:\.\d+)?)\.?(?:OC|DI)?$/);
  if (m) return { symbol: token, tipo: m[1] === 'C' ? 'CALL' : 'PUT', strike: parseFloat(m[2]) };

  m = token.match(/^(.+?)([CV])(\d{2,7}(?:\.\d+)?)\.?(?:OC|DI)?$/);
  if (m) return { symbol: token, tipo: m[2] === 'C' ? 'CALL' : 'PUT', strike: parseFloat(m[3]) };

  return { symbol: token, tipo: null, strike: null };
}

// Moneyness calculada localmente — el backend marca TODOS los puts como OTM
function moneynessOf(strike, spot, tipo) {
  if (!(strike > 0) || !(spot > 0) || (tipo !== 'CALL' && tipo !== 'PUT')) return null;
  const diff = (strike - spot) / spot;
  if (Math.abs(diff) < ATM_TOL) return 'ATM';
  if (tipo === 'CALL') return diff < 0 ? 'ITM' : 'OTM';
  return diff > 0 ? 'ITM' : 'OTM'; // PUT: strike > spot = ITM
}

const PRICE_FIELDS = ['ultimo_precio','apertura_prima','min_prima','max_prima','precio_teorico'];

function sanitizeCadena(rawRows) {
  const spot = rawRows.find(r => r.precio_suby > 0)?.precio_suby || 0;
  const out = [];
  const droppedSyms = [];
  let rawCount = 0;

  for (let r of rawRows) {
    // 1) El backend metió la línea cruda del feed en symbol → recuperar ticker/strike/tipo
    if (/\s/.test(String(r.symbol || '').trim())) {
      const info = parseTicker(r.symbol);
      r = {
        ...r,
        symbol: info.symbol,
        symbol_raw: String(r.symbol).trim(),
        tipo: (r.tipo === 'CALL' || r.tipo === 'PUT') ? r.tipo : info.tipo,
        strike: (r.strike > 0) ? r.strike : info.strike,
        _raw: true,
      };
      rawCount++;
    }
    // 2) Tipo ausente → deducir del ticker
    if (r.tipo !== 'CALL' && r.tipo !== 'PUT') {
      const info = parseTicker(r.symbol);
      if (!info.tipo) { droppedSyms.push(r.symbol); continue; }
      r = { ...r, tipo: info.tipo };
    }
    // 3) Strike ausente o inválido → deducir del ticker; sin strike la fila no sirve
    if (!(r.strike > 0)) {
      const info = parseTicker(r.symbol);
      if (!info.strike) { droppedSyms.push(r.symbol); continue; }
      r = { ...r, strike: info.strike };
    }
    // 4) Precios negativos → no existen primas negativas
    const patch = {};
    for (const f of PRICE_FIELDS) {
      if (r[f] != null && r[f] < 0) patch[f] = null;
    }
    // 5) Teórico $0 = solver roto → teórico y desvío no son confiables
    if (!(r.precio_teorico > 0)) { patch.precio_teorico = null; patch.desvio_teorico = null; }
    // 6) FIX: antes se chequeaba r._iv_ult (que acá no existe todavía) y el filtro era un no-op
    if (r.vol_implicita != null && (r.vol_implicita < IV_MIN || r.vol_implicita > IV_MAX)) {
      patch.vol_implicita = null;
    }
    if (Object.keys(patch).length) r = { ...r, ...patch };
    // 7) Moneyness recalculada siempre que se pueda
    const mn = moneynessOf(r.strike, spot, r.tipo);
    if (mn) r.moneyness = mn;

    out.push(r);
  }

  if (droppedSyms.length) console.warn(`[sanitize] ${droppedSyms.length} filas descartadas (sin strike/tipo recuperable):`, droppedSyms.slice(0,5));
  if (rawCount) console.warn(`[sanitize] ${rawCount} filas reconstruidas desde línea cruda del feed`);

  return { rows: out, dropped: droppedSyms.length };
}

// Mejor IV disponible de una fila, con calidad: mid de BO > un lado > último
function ivOf(r) {
  const v = (r.vi_ultimo > 0 ? r.vi_ultimo : r.vol_implicita) || null;
  if (v == null || v < IV_MIN || v > IV_MAX) return null;
  return v;
}

// ── CURVA TEÓRICA (fit único robusto por vencimiento) ─────────────────────────
// Un punto por strike usando el lado OTM (paridad put-call: call(K) y put(K) comparten IV).
// La IV ITM es ruido (prima ~100% intrínseca) → se descarta a favor del lado OTM del strike.
function bestIV(r) {
  const b = r.vi_bid > 0 ? r.vi_bid : null;
  const o = r.vi_offer > 0 ? r.vi_offer : null;
  if (b && o) {
    if (o < b) return null;                       // libro cruzado = basura
    return { iv: (b + o) / 2, q: 1.0 };
  }
  if (b) return { iv: b, q: 0.7 };
  if (o) return { iv: o, q: 0.7 };
  if (r._iv_ult > 0) return { iv: r._iv_ult, q: 0.5 };
  return null;
}

function buildSmileSample(rows, spot, dias, tasaPct) {
  const T = Math.max((dias || 16) / 365, 1 / 365);
  const F = spot * Math.exp(((tasaPct || 0) / 100) * T);   // forward, no spot
  const byStrike = new Map();

  for (const r of rows) {
    if (!(r.strike > 0)) continue;
    if (r.valor_temporal != null && r.valor_temporal <= 0) continue;
    const b = bestIV(r);
    if (!b || b.iv < IV_MIN || b.iv > IV_MAX) continue;

    const cand = { iv: b.iv, q: b.q,
      otm: r.tipo === 'CALL' ? r.strike >= F : r.strike <= F };
    const cur = byStrike.get(r.strike);
    if (!cur) { byStrike.set(r.strike, cand); continue; }
    if (cand.otm !== cur.otm)      { if (cand.otm)       byStrike.set(r.strike, cand); }
    else if (cand.q !== cur.q)     { if (cand.q > cur.q) byStrike.set(r.strike, cand); }
    else cur.iv = (cur.iv + cand.iv) / 2;   // mismo side, misma calidad → promedio
  }

  const pts = [...byStrike.entries()].map(([K, p]) => ({ k: Math.log(K / F), iv: p.iv, q: p.q }));
  return { pts, F, T };
}

// Peso ∝ vega: decae al alejarse del ATM (lo que ancla la curva)
function vegaW(k, iv, T) {
  const s = (iv / 100) * Math.sqrt(T);
  if (!(s > 0)) return 0;
  const d1 = (-k + 0.5 * s * s) / s;
  return Math.exp(-0.5 * d1 * d1);
}

// Gauss 3x3 con pivoteo
function solve3(A, b) {
  const M = A.map((row,i) => [...row, b[i]]);
  for (let c = 0; c < 3; c++) {
    let p = c;
    for (let r = c+1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    const d = M[c][c] || 1e-12;
    for (let j = c; j < 4; j++) M[c][j] /= d;
    for (let r = 0; r < 3; r++) {
      if (r === c) continue;
      const f = M[r][c];
      for (let j = c; j < 4; j++) M[r][j] -= f * M[c][j];
    }
  }
  return [M[0][3], M[1][3], M[2][3]];
}

// σ(k) = c0 + c1·k + c2·k²  (k = ln(K/F)) — IRLS-Huber: los outliers (VI Offer 352%)
// terminan con peso ~0 y no mueven la curva.
function fitQuadRobusta(pts, T, { iters = 25, huber = 1.5 } = {}) {
  if (!pts || pts.length < 5) return null;
  const ks = pts.map(p => p.k);
  if (Math.max(...ks) - Math.min(...ks) < 1e-4) return null;

  const data = pts.map(p => ({ ...p, w: p.q * vegaW(p.k, p.iv, T) }));
  let c = null;

  for (let it = 0; it < iters; it++) {
    const S = [[0,0,0],[0,0,0],[0,0,0]], t = [0,0,0];
    for (const p of data) {
      const x = [1, p.k, p.k * p.k];
      for (let i = 0; i < 3; i++) {
        t[i] += p.w * x[i] * p.iv;
        for (let j = 0; j < 3; j++) S[i][j] += p.w * x[i] * x[j];
      }
    }
    const c2 = solve3(S, t);
    if (!c2 || !c2.every(v => Number.isFinite(v) && Math.abs(v) < 1e7)) break;
    c = c2;
    const res = data.map(p => p.iv - (c[0] + c[1]*p.k + c[2]*p.k*p.k));
    const sc = 1.4826 * median(res.map(Math.abs)) || 1;
    data.forEach((p, i) => {
      const u = Math.abs(res[i]) / sc;
      const hub = u <= huber ? 1 : huber / u;
      p.w = pts[i].q * vegaW(p.k, p.iv, T) * hub;
    });
  }
  if (!c) return null;
  return k => c[0] + c[1]*k + c[2]*k*k;
}

// ── DATA ───────────────────────────────────────────────────────────────────────
async function loadData() {
  if (document.hidden) return;

  try {
    const [subRes, resRes] = await Promise.allSettled([
      fjson(`${API}/api/opciones/subyacentes`),
      fjson(`${API}/api/opciones/resumen`),
    ]);

    if (subRes.status === 'fulfilled') state.subyacentes = subRes.value.data || [];
    if (resRes.status === 'fulfilled') state.resumen   = resRes.value || {};
    if (subRes.status === 'rejected' && resRes.status === 'rejected') throw new Error('Sin respuesta del servidor');

    const fecha = (subRes.status==='fulfilled' && subRes.value.fecha) || state.resumen.fecha || '—';
    const totalOps = state.subyacentes.reduce((a,s) => a + (s.calls||0) + (s.puts||0), 0);

    document.getElementById('h-fecha').textContent = fecha;
    document.getElementById('h-total').textContent = totalOps;
    document.getElementById('fecha-pill').textContent = 'datos: ' + fecha;
    const pill = document.getElementById('live-pill');
    pill.textContent = '● en vivo';
    pill.classList.add('live'); pill.classList.remove('err');
    document.getElementById('h-updated').textContent = 'Act: ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});

    buildSidebar();
    if (state.currentSuby) await loadCadena(state.currentSuby, true);
  } catch(e) {
    const pill = document.getElementById('live-pill');
    pill.textContent = '● error';
    pill.classList.remove('live'); pill.classList.add('err');
    console.error(e);
  }
}

async function loadCadena(suby, silent = false) {
  cadenaAbort?.abort();
  const ctrl = new AbortController();
  cadenaAbort = ctrl;

  const content = document.getElementById('content');
  const scrollTop = content.scrollTop;
  if (!silent) {
    content.innerHTML = '<div class="loading">Cargando cadena...</div>';
    lastCadenaJson = null;
  }

  document.querySelectorAll('.sb-btn').forEach(b => b.classList.toggle('active', b.dataset.suby === suby));

  try {
    const d = await fjson(`${API}/api/opciones/cadena?subyacente=${encodeURIComponent(suby)}`, { signal: ctrl.signal });
    if (ctrl.signal.aborted) return;

    state.currentSuby = suby;
    const { rows, dropped } = sanitizeCadena(d.data || []);
    state.cadena = rows;
    state.dropped = dropped;

    const json = JSON.stringify(state.cadena);
    const unchanged = silent && json === lastCadenaJson;
    lastCadenaJson = json;

    document.getElementById('suby-header').style.display = 'block';
    document.getElementById('controls').style.display = 'flex';

    populateVtos();          // primero el select (el header lee el filtro elegido)
    updateSubyHeader(suby);

    if (!unchanged) renderView();
    if (silent) content.scrollTop = scrollTop;
  } catch(e) {
    if (e.name === 'AbortError') return;
    showEmpty('Error cargando cadena: ' + e.message);
  }
}

function updateSubyHeader(suby) {
  const s = state.subyacentes.find(x => x.subyacente === suby) || {};
  const sample = state.cadena.find(x => x.precio_suby) || {};
  const pcRatio = state.resumen.put_call_ratio?.[suby];
  const tasa = state.cadena.find(x => x.tasa_libre != null)?.tasa_libre;

  const pcValid = typeof pcRatio === 'number' && isFinite(pcRatio);
  const pcTxt = pcValid ? (pcRatio > PC_CAP ? '>' + PC_CAP : pcRatio.toFixed(2)) : null;
  const pcCls = !pcValid ? '' : pcRatio >= 1 ? 'dn' : pcRatio <= 0.7 ? 'up' : '';

  const vtoSel = document.getElementById('ctrl-vto').value;
  let diasTxt = '—';
  if (vtoSel) {
    const r = state.cadena.find(x => x.vencimiento === vtoSel && x.dias_vto != null);
    if (r) diasTxt = r.dias_vto;
  } else {
    const dv = state.cadena.map(r => r.dias_vto).filter(v => v != null);
    if (dv.length) {
      const mn = Math.min(...dv), mx = Math.max(...dv);
      diasTxt = mn === mx ? mn : `${mn}–${mx}`;
    }
  }

  document.getElementById('suby-name').textContent = suby;
  document.getElementById('suby-meta').innerHTML = `
    <div class="meta-item">Precio suby: <span class="gold">$${fmt(sample.precio_suby)}</span></div>
    <div class="meta-item">Calls: <span>${s.calls||0}</span></div>
    <div class="meta-item">Puts: <span>${s.puts||0}</span></div>
    <div class="meta-item">Vol ARS: <span>${fmtM(s.volumen_ars)}</span></div>
    <div class="meta-item">OI: <span>${fmtN(s.open_interest)}</span></div>
    ${pcTxt!=null?`<div class="meta-item">Put/Call: <span class="${pcCls}">${pcTxt}</span></div>`:''}
    <div class="meta-item">Tasa libre: <span>${tasa!=null?tasa+'%':'—'}</span></div>
    <div class="meta-item">Días vto: <span>${diasTxt}</span></div>
    ${state.dropped>0?`<div class="meta-item" title="Filas descartadas por datos inservibles (sin strike/tipo recuperable)">Inválidas ocultas: <span class="dn">${state.dropped}</span></div>`:''}
  `;
}

function populateVtos() {
  const sel = document.getElementById('ctrl-vto');
  const vtos = [...new Set(state.cadena.map(r => r.vencimiento).filter(Boolean))].sort();
  const prev = sel.value;
  sel.innerHTML = '<option value="">Todos</option>' +
    vtos.map(v => `<option value="${esc(v)}">${vtoLabel(v)}</option>`).join('');
  sel.value = vtos.includes(prev) ? prev : '';
}

// ── SIDEBAR ────────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  if (!state.subyacentes.length) {
    sb.innerHTML = '<div class="loading" style="height:200px">Sin datos</div>';
    return;
  }

  const sorted = [...state.subyacentes].sort((a,b) => b.volumen_ars - a.volumen_ars);
  const maxVol = sorted[0]?.volumen_ars || 1;

  let html = '<div class="sb-section"><div class="sb-label">Subyacentes</div>';
  for (const s of sorted) {
    const pct = Math.round(s.volumen_ars / maxVol * 100);
    html += `
      <button class="sb-btn ${s.subyacente===state.currentSuby?'active':''}" data-suby="${esc(s.subyacente)}">
        <span>${esc(s.subyacente)}</span>
        <span class="sb-vol">${fmtM(s.volumen_ars)}</span>
      </button>
      <div style="margin:0 14px 2px;height:2px;background:#1a1710;border-radius:1px">
        <div style="width:${pct}%;height:2px;background:${s.subyacente===state.currentSuby?'#C9960A':'#2a2510'};border-radius:1px"></div>
      </div>`;
  }
  html += '</div>';
  sb.innerHTML = html;
}

// ── FILTROS COMPARTIDOS ────────────────────────────────────────────────────────
function getFilteredRows() {
  const tipo = document.getElementById('ctrl-tipo').value;
  const vto  = document.getElementById('ctrl-vto').value;
  const show = document.getElementById('ctrl-show').value;

  let rows = state.cadena;
  if (tipo) rows = rows.filter(r => r.tipo === tipo);
  if (vto)  rows = rows.filter(r => r.vencimiento === vto);
  if (show === 'traded') rows = rows.filter(r => (r.volumen_ars||0) > 0);
  if (show === 'oi')     rows = rows.filter(r => (r.open_interest||0) > 0);

  // filas sin strike van al FINAL, no arriba
  const sk = r => (r.strike > 0 ? r.strike : Infinity);
  return [...rows].sort((a,b) =>
    sk(a) - sk(b) ||
    (a.tipo||'').localeCompare(b.tipo||'') ||
    (a.vencimiento||'').localeCompare(b.vencimiento||''));
}

// ── VIEWS ──────────────────────────────────────────────────────────────────────
function switchView(view, btn) {
  if (!state.currentSuby) return;
  state.view = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderView();
}

function renderView() {
  if (state.view === 'cadena') renderCadena();
  else if (state.view === 'smile') renderSmile();
  else renderResumen();
}

// ── CADENA ─────────────────────────────────────────────────────────────────────
function renderCadena() {
  const rows = getFilteredRows();
  if (!rows.length) { showEmpty('Sin opciones para los filtros seleccionados'); return; }

  const badge = m => m==='ATM' ? '<span class="badge-atm">ATM</span>'
              : m==='ITM'  ? '<span class="badge-itm">ITM</span>'
              : m==='OTM'  ? '<span class="badge-otm">OTM</span>' : '—';
  const desvCls = v => v==null ? 'muted' : v>0 ? 'pos' : v<0 ? 'neg' : '';

  let html = `<table><thead><tr>
    <th>Símbolo</th><th>Tipo</th><th>Strike</th><th>Venc.</th><th class="center">Mony</th>
    <th>Último</th><th>VI Bid</th><th>VI Of.</th><th>IV</th><th>V. Temp</th>
    <th>Teórico</th><th>Desvío</th><th>Vol ARS</th><th>OI</th><th>Días</th>
  </tr></thead><tbody>`;
  for (const r of rows) {
    const iv = ivOf(r);
    const d = r.desvio_teorico;
    html += `<tr class="${r.moneyness==='ATM'?'atm':''}">
      <td class="sym ${r._raw?'raw':''}" title="${esc(r.symbol_raw||r.symbol)}">${esc(r.symbol)}</td>
      <td class="${r.tipo==='CALL'?'pos':r.tipo==='PUT'?'neg':'muted'}">${esc(r.tipo||'—')}</td>
      <td>${r.strike>0?fmt(r.strike):'—'}</td>
      <td>${r.vencimiento?esc(vtoLabel(r.vencimiento)):'—'}</td>
      <td class="center">${badge(r.moneyness)}</td>
      <td>${fmt(r.ultimo_precio)}</td>
      <td>${fmt(r.vi_bid)}</td>
      <td>${fmt(r.vi_offer)}</td>
      <td class="${iv!=null?'gold':''}">${iv!=null?iv.toFixed(2)+'%':'—'}</td>
      <td>${fmt(r.valor_temporal)}</td>
      <td>${fmt(r.precio_teorico)}</td>
      <td class="${desvCls(d)}">${d!=null?((d>0?'+':'')+d.toFixed(1)+'%'):'—'}</td>
      <td>${fmtM(r.volumen_ars)}</td>
      <td>${fmtN(r.open_interest)}</td>
      <td>${r.dias_vto!=null?r.dias_vto:'—'}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

// ── IV SMILE ───────────────────────────────────────────────────────────────────
function renderSmile() {
  const vto  = document.getElementById('ctrl-vto').value;
  const show = document.getElementById('ctrl-show').value;
  const tipoFiltro = document.getElementById('ctrl-tipo').value;
  const st = tipoFiltro === 'CALL' ? 'call' : tipoFiltro === 'PUT' ? 'put' : 'ambos';

  // Clave de contexto — resetea zoom solo si cambia suby/vto/tipo
  const zoomKey = (state.currentSuby||'') + '|' + vto + '|' + st;

  state.cadena.forEach(r => { r._iv_ult = ivOf(r); });

  // Puntos del chart: excluye opciones sin valor temporal (muy ITM, precio viejo)
  let base = state.cadena.filter(r => r.strike > 0 && r._iv_ult > 0
    && (r.valor_temporal == null || r.valor_temporal > 0));
  let baseBO = state.cadena.filter(r => r.strike > 0 && (r.vi_bid > 0 || r.vi_offer > 0));
  if (vto)   { base = base.filter(r => r.vencimiento === vto); baseBO = baseBO.filter(r => r.vencimiento === vto); }
  if (show === 'traded') { base = base.filter(r => (r.volumen_ars||0) > 0); baseBO = baseBO.filter(r => (r.volumen_ars||0) > 0); }
  if (show === 'oi')     { base = base.filter(r => (r.open_interest||0) > 0); baseBO = baseBO.filter(r => (r.open_interest||0) > 0); }
  if (!base.length) { showEmpty('Sin datos de IV para los filtros seleccionados'); return; }

  let rows = st === 'call' ? base.filter(r=>r.tipo==='CALL')
           : st === 'put'  ? base.filter(r=>r.tipo==='PUT')
           : base;
  if (!rows.length) rows = base;

  const calls   = base.filter(r => r.tipo==='CALL').sort((a,b)=>a.strike-b.strike);
  const puts    = base.filter(r => r.tipo==='PUT').sort((a,b)=>a.strike-b.strike);
  const callsBO = baseBO.filter(r => r.tipo==='CALL').sort((a,b)=>a.strike-b.strike);
  const putsBO  = baseBO.filter(r => r.tipo==='PUT').sort((a,b)=>a.strike-b.strike);
  const spot    = base.find(r=>r.precio_suby)?.precio_suby || 0;
  const allIV   = rows.map(r=>r._iv_ult).filter(v=>v>0);
  if (!allIV.length) { showEmpty('Sin datos de IV Último para los filtros seleccionados'); return; }

  const ivMin = Math.min(...allIV), ivMax = Math.max(...allIV);
  const ivAvg = (allIV.reduce((a,b)=>a+b,0)/allIV.length).toFixed(2);
  const atmRow = spot>0 ? rows.reduce((b,r)=>r._iv_ult>0&&Math.abs(r.strike-spot)<Math.abs((b?.strike||999999)-spot)?r:b,null) : null;
  const otmP = spot>0 ? puts.filter(r=>r.strike<spot*0.95&&r._iv_ult>0).at(-1) : null;
  const otmC = spot>0 ? calls.filter(r=>r.strike>spot*1.05&&r._iv_ult>0)[0] : null;
  const skew = otmP&&otmC ? +(otmP._iv_ult-otmC._iv_ult).toFixed(2) : null;
  const vh = rows.map(r=>r.vol_hist_40r).find(v=>v!=null);

  // ── Curva teórica: UN solo fit por vencimiento ──
  // Mezclar vencimientos no tiene sentido → sin vto seleccionado no se fitea.
  // El fit usa el pool con bid/offer (aunque el último sea basura) + lado OTM por strike.
  let fitTeorica = null, Fwd = spot, notaFit = '';
  if (!vto) {
    notaFit = 'Curva teórica: filtrá por un vencimiento';
  } else if (spot > 0) {
    let poolFit = state.cadena.filter(r => r.strike > 0
      && (r.valor_temporal == null || r.valor_temporal > 0)
      && r.vencimiento === vto);
    if (show === 'traded') poolFit = poolFit.filter(r => (r.volumen_ars||0) > 0);
    if (show === 'oi')     poolFit = poolFit.filter(r => (r.open_interest||0) > 0);
    const tasaPct = state.cadena.find(x => x.tasa_libre != null)?.tasa_libre;
    const dias = state.cadena.find(x => x.vencimiento === vto && x.dias_vto != null)?.dias_vto;
    const smp = buildSmileSample(poolFit, spot, dias, tasaPct);
    fitTeorica = fitQuadRobusta(smp.pts, smp.T);
    Fwd = smp.F;
    if (!fitTeorica) notaFit = 'Curva teórica: sin suficientes strikes OTM limpios';
  }

  const showCalls = st === 'call' || st === 'ambos';
  const showPuts  = st === 'put'  || st === 'ambos';
  const soloUno   = st === 'call' || st === 'put';
  const visRows   = base.filter(r => (showCalls && r.tipo==='CALL') || (showPuts && r.tipo==='PUT'));
  const visRowsBO = baseBO.filter(r => (showCalls && r.tipo==='CALL') || (showPuts && r.tipo==='PUT'));

  const legendItems = [];
  if(showCalls){
    legendItems.push(['Call Oper','rgba(220,220,220,0.9)',false],['Call IAMC','rgba(180,130,255,0.9)',false]);
    if(soloUno) legendItems.push(['VI Bid','rgba(58,176,122,0.9)',false],['VI Offer','rgba(192,57,43,0.9)',false]);
  }
  if(showPuts){
    legendItems.push(['Put Oper','rgba(220,220,0,0.95)',false],['Put IAMC','rgba(255,160,50,0.9)',false]);
    if(soloUno) legendItems.push(['VI Bid','rgba(58,176,122,0.9)',false],['VI Offer','rgba(192,57,43,0.9)',false]);
  }
  if(fitTeorica) legendItems.push(['Teórica','rgba(111,168,220,0.95)',true]);

  const sArr = (visRows.length ? visRows : base).map(r=>r.strike);
  const sMin = Math.min(...sArr), sMax = Math.max(...sArr);
  state._smileRange = { min: sMin, max: sMax };

  if (!state._smileZoom || state._smileZoomKey !== zoomKey) {
    const sRange = sMax - sMin || 1;
    state._smileZoom = { xMin: sMin - sRange*0.03, xMax: sMax + sRange*0.03 };
    state._smileZoomKey = zoomKey;
  }

  // Rebuild DOM solo si no existe el canvas; los stats se actualizan SIEMPRE (fix:
  // antes quedaban congelados al cambiar filtros porque el canvas persistía)
  if (!document.getElementById('sc')) {
    document.getElementById('content').innerHTML = `
      <div style="padding:16px 20px;overflow:auto;height:100%">
        <div style="background:#12100a;border:0.5px solid #2a2510;border-radius:6px;padding:14px;margin-bottom:14px">
          <canvas id="sc" width="1200" height="507" style="width:100%;height:507px;cursor:grab"></canvas>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;min-height:14px">
            <div id="stt" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#c8c0b0"></div>
            <button onclick="resetSmileZoom()" style="padding:2px 8px;background:none;border:0.5px solid #2a2510;color:#706858;cursor:pointer;font-size:9px;font-family:'JetBrains Mono',monospace;border-radius:3px" title="Restablecer zoom">↺ zoom</button>
          </div>
        </div>
        <div id="smile-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"></div>
      </div>`;
  }
  document.getElementById('stt').textContent = notaFit;
  document.getElementById('smile-stats').innerHTML = [
    ['IV Mín',ivMin.toFixed(2)+'%',''],
    ['IV Máx',ivMax.toFixed(2)+'%',''],
    ['IV Prom',ivAvg+'%','#C9960A'],
    ['IV ATM',atmRow?atmRow._iv_ult.toFixed(2)+'%':'—','#C9960A'],
    ['Skew Put-Call',skew!=null?(skew>0?'+':'')+skew+'%':'—',skew>0?'#c0392b':skew<0?'#3ab07a':''],
    ['VH 40r',vh!=null?vh.toFixed(2)+'%':'—',''],
    ['Strikes',allIV.length,''],
    ['Spot','$'+fmt(spot),'#C9960A'],
  ].map(([l,v,c])=>`<div style="background:#0e0d0a;border:0.5px solid #2a2510;border-radius:4px;padding:8px 10px">
    <div style="font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;color:#706858;margin-bottom:3px">${l}</div>
    <div style="font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${c||'#e8e0cc'}">${v}</div>
  </div>`).join('');

  // Dibujar canvas
  const canvas = document.getElementById('sc');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth, H = 507;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const pad = {l:50,r:16,t:28,b:32};
  const cW = W-pad.l-pad.r, cH = H-pad.t-pad.b;
  const ly = pad.t - 14;

  // Función de dibujo reutilizable (usa zoom actual)
  function doDraw() {
    redrawSmileCanvas(canvas, ctx, dpr, W, H, pad, cW, cH,
      state._smileZoom.xMin, state._smileZoom.xMax,
      spot, sMin, sMax, showCalls, showPuts, soloUno,
      calls, puts, callsBO, putsBO, visRows, legendItems, ly,
      fitTeorica, Fwd, !!vto);
  }
  state._smileRedraw = doDraw;
  doDraw();

  // Zoom con rueda
  canvas.onwheel = e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const z = state._smileZoom;
    const range = z.xMax - z.xMin;
    const factor = e.deltaY < 0 ? 0.85 : 1/0.85;
    const pivot = z.xMin + (mx - pad.l) / cW * range;
    const newRange = Math.max((sMax-sMin)*0.05, range * factor);
    const margin = (sMax-sMin)*0.1;
    let newMin = pivot - (pivot - z.xMin) / range * newRange;
    let newMax = newMin + newRange;
    if(newMin < sMin - margin){ newMin = sMin - margin; newMax = newMin + newRange; }
    if(newMax > sMax + margin){ newMax = sMax + margin; newMin = newMax - newRange; }
    state._smileZoom = { xMin: newMin, xMax: newMax };
    doDraw();
  };

  // Pan con drag + tooltip
  let dragStart = null;
  const tipRows   = visRows.length ? visRows : base;
  const tipRowsBO = visRowsBO.length ? visRowsBO : baseBO;

  canvas.onmousedown = e => {
    dragStart = { x: e.clientX, zoom: {...state._smileZoom} };
    canvas.style.cursor = 'grabbing';
  };
  canvas.onmousemove = e => {
    if(dragStart) {
      const rect = canvas.getBoundingClientRect();
      const dx = (e.clientX - dragStart.x) * (W / rect.width);
      const range = dragStart.zoom.xMax - dragStart.zoom.xMin;
      const shift = -dx / cW * range;
      state._smileZoom = { xMin: dragStart.zoom.xMin + shift, xMax: dragStart.zoom.xMax + shift };
      doDraw();
    } else {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);
      const my = (e.clientY - rect.top) * (H / rect.height);
      const z = state._smileZoom;
      const yR = state._smileY || { yMin: 0, yMax: 100 };
      const xsL = s => pad.l + (z.xMax===z.xMin ? cW/2 : (s-z.xMin)/(z.xMax-z.xMin)*cW);
      const ysL = v => pad.t + cH - ((v - yR.yMin) / (yR.yMax - yR.yMin) * cH);
      let best=null, bd=20;
      [...tipRows,...tipRowsBO].forEach(r=>{
        [['_iv_ult',r._iv_ult],['vi_bid',r.vi_bid],['vi_offer',r.vi_offer]].forEach(([field,val])=>{
          if(!(val>0)) return;
          const d=Math.hypot(xsL(r.strike)-mx,ysL(val)-my);
          if(d<bd){bd=d;best={r,field,val};}
        });
      });
      const stt = document.getElementById('stt');
      if(stt) stt.innerHTML = best
        ? `<span style="color:${best.r.tipo==='CALL'?'#3ab07a':'#c0392b'}">${esc(best.r.tipo)}</span> · ${esc(best.r.symbol)} · $${fmt(best.r.strike)} · <span style="color:#706858">${best.field==='_iv_ult'?'IV Últ':best.field==='vi_bid'?'VI Bid':'VI Offer'}</span> <span style="color:#C9960A">${best.val.toFixed(2)}%</span> · Último $${fmt(best.r.ultimo_precio)} · OI ${fmtN(best.r.open_interest)}`
        : esc(notaFit);
    }
  };
  canvas.onmouseup = () => { dragStart = null; canvas.style.cursor = 'grab'; };
  canvas.onmouseleave = () => {
    dragStart = null;
    canvas.style.cursor = 'grab';
    const stt = document.getElementById('stt');
    if(stt) stt.textContent = notaFit;
  };
}

function resetSmileZoom() {
  const r = state._smileRange || { min: 0, max: 1 };
  const range = r.max - r.min || 1;
  state._smileZoom = { xMin: r.min - range*0.03, xMax: r.max + range*0.03 };
  state._smileRedraw?.();
}

// Dibuja el smile completo. Rango Y por percentiles 5–95 de lo visible + clip del
// área de plot: un quote extremo (352%) deja de aplastar el chart y de cruzar ejes.
function redrawSmileCanvas(canvas, ctx, dpr, W, H, pad, cW, cH,
    xMin, xMax, spot, sMin, sMax,
    showCalls, showPuts, soloUno, calls, puts, callsBO, putsBO, visRows, legendItems, ly,
    fit, F, conVto) {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#12100a'; ctx.fillRect(0,0,W,H);

  const inView = r => r.strike >= xMin && r.strike <= xMax;

  const yVals = [
    ...(showCalls ? calls.filter(inView).map(r=>r._iv_ult).filter(v=>v>0) : []),
    ...(showPuts  ? puts.filter(inView).map(r=>r._iv_ult).filter(v=>v>0)  : []),
    ...(showCalls && soloUno ? callsBO.filter(inView).flatMap(r=>[r.vi_bid,r.vi_offer].filter(v=>v>0)) : []),
    ...(showPuts  && soloUno ? putsBO.filter(inView).flatMap(r=>[r.vi_bid,r.vi_offer].filter(v=>v>0))  : []),
  ];
  let yMin = 40, yMax = 120;
  if (yVals.length) {
    let lo = pctl(yVals,.05), hi = pctl(yVals,.95);
    if (!(hi > lo)) { const m = (hi+lo)/2; lo = m-1; hi = m+1; }
    const p = Math.max((hi-lo)*0.08, 0.4);
    yMin = lo - p; yMax = hi + p;
  }
  state._smileY = { yMin, yMax };

  const xs = s => pad.l + (xMax===xMin ? cW/2 : (s-xMin)/(xMax-xMin)*cW);
  const ys = v => pad.t + cH - (yMax===yMin ? cH/2 : (v-yMin)/(yMax-yMin)*cH);

  // Grid Y
  for(let i=0;i<=5;i++){
    const v=yMin+(yMax-yMin)*i/5, y=ys(v);
    ctx.strokeStyle='#1a1710'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='#706858'; ctx.font='9px monospace'; ctx.textAlign='right';
    ctx.fillText(v.toFixed(1)+'%',pad.l-3,y+3);
  }
  // Grid X
  for(let i=0;i<=6;i++){
    const s=xMin+(xMax-xMin)*i/6, x=xs(s);
    ctx.strokeStyle='#1a1710'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
    ctx.fillStyle='#706858'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText('$'+Math.round(s).toLocaleString('es-AR'),x,H-pad.b+12);
  }
  // ATM
  if(spot>=xMin&&spot<=xMax){
    const xa=xs(spot);
    ctx.strokeStyle='rgba(201,150,10,0.3)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(xa,pad.t); ctx.lineTo(xa,H-pad.b); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#C9960A'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText('ATM',xa,H-pad.b+22);
  }

  // Gaussiana de referencia (solo con vencimiento seleccionado)
  function drawGaussBell(vol, strokeCol, fillCol) {
    if(!vol || !spot || spot<=0) return;
    const sqrtT = Math.sqrt(T_years);
    const sigma = spot * vol * sqrtT;
    const nPts = 120;
    const kFrom = Math.max(xMin, spot - 3.5*sigma);
    const kTo   = Math.min(xMax, spot + 3.5*sigma);
    if(kTo <= kFrom) return;
    const bellH = cH * 0.92;
    const base  = pad.t + cH;
    const pts = [];
    for(let i=0; i<=nPts; i++){
      const k = kFrom + (kTo-kFrom)*i/nPts;
      const z = (k - spot) / sigma;
      const g = Math.exp(-0.5*z*z);
      pts.push({ x: xs(k), y: base - g*bellH });
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, base);
    pts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(pts[pts.length-1].x, base);
    ctx.closePath();
    ctx.fillStyle = fillCol;
    ctx.fill();
    ctx.beginPath();
    pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 1;
    ctx.stroke();
    [-1,1].forEach(sign => {
      const kSig = spot * Math.exp(sign * vol * sqrtT);
      if(kSig>=xMin && kSig<=xMax){
        ctx.beginPath();
        ctx.moveTo(xs(kSig), base);
        ctx.lineTo(xs(kSig), base - bellH*Math.exp(-0.5));
        ctx.strokeStyle = strokeCol;
        ctx.lineWidth = 0.5;
        ctx.setLineDash([3,3]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    });
  }

  // Curva teórica: σ(k) = cuadrática en ln(K/F) salida del fit único
  function drawTeorica(f, Fwd) {
    if (!f || !(Fwd > 0)) return;
    const KFrom = Math.max(xMin, sMin - (sMax-sMin)*0.10);
    const KTo   = Math.min(xMax, sMax + (sMax-sMin)*0.10);
    if (!(KTo > KFrom)) return;
    const N = 90, pts = [];
    for (let i = 0; i <= N; i++) {
      const K = KFrom + (KTo-KFrom)*i/N;
      const iv = f(Math.log(K/Fwd));
      if (iv > 0.5 && iv < 400) pts.push({ x: xs(K), y: ys(iv) });
    }
    if (pts.length < 3) return;
    ctx.strokeStyle = 'rgba(111,168,220,0.95)';
    ctx.lineWidth = 1.8; ctx.setLineDash([5,3]);
    ctx.beginPath();
    pts.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.stroke(); ctx.setLineDash([]);
  }

  // ── Series dentro de clip (lo que cae fuera del rango Y no ensucia el gráfico) ──
  ctx.save();
  ctx.beginPath(); ctx.rect(pad.l, pad.t, cW, cH); ctx.clip();

  if (conVto) {
    const atmRowG = [...calls,...puts].reduce((b,r)=>r._iv_ult>0&&Math.abs(r.strike-spot)<Math.abs((b?.strike||999999)-spot)?r:b,null);
    const ivAtmG  = atmRowG ? atmRowG._iv_ult/100 : null;
    const dRow    = [...calls,...puts].find(r=>r.dias_vto>0);
    const T_years = (dRow?.dias_vto||16)/365;
    if (ivAtmG) drawGaussBell(ivAtmG, 'rgba(201,150,10,0.4)', 'rgba(201,150,10,0.05)');
  }

  drawTeorica(fit, F);

  // ── Líneas ──
  if(showCalls){
    if(soloUno){
      const cBidL=callsBO.filter(r=>r.vi_bid>0&&inView(r));
      const cOffL=callsBO.filter(r=>r.vi_offer>0&&inView(r));
      if(cBidL.length>=2){ctx.strokeStyle='rgba(58,176,122,0.7)';ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.beginPath();cBidL.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r.vi_bid)):ctx.lineTo(xs(r.strike),ys(r.vi_bid)));ctx.stroke();ctx.setLineDash([]);}
      if(cOffL.length>=2){ctx.strokeStyle='rgba(192,57,43,0.7)';ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.beginPath();cOffL.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r.vi_offer)):ctx.lineTo(xs(r.strike),ys(r.vi_offer)));ctx.stroke();ctx.setLineDash([]);}
    }
    const cUlt=calls.filter(r=>r._iv_ult>0&&inView(r));
    if(cUlt.length>=2){ctx.strokeStyle='rgba(220,220,220,0.7)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();cUlt.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r._iv_ult)):ctx.lineTo(xs(r.strike),ys(r._iv_ult)));ctx.stroke();ctx.setLineDash([]);}
  }
  if(showPuts){
    if(soloUno){
      const pBidL=putsBO.filter(r=>r.vi_bid>0&&inView(r));
      const pOffL=putsBO.filter(r=>r.vi_offer>0&&inView(r));
      if(pBidL.length>=2){ctx.strokeStyle='rgba(58,176,122,0.7)';ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.beginPath();pBidL.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r.vi_bid)):ctx.lineTo(xs(r.strike),ys(r.vi_bid)));ctx.stroke();ctx.setLineDash([]);}
      if(pOffL.length>=2){ctx.strokeStyle='rgba(192,57,43,0.7)';ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.beginPath();pOffL.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r.vi_offer)):ctx.lineTo(xs(r.strike),ys(r.vi_offer)));ctx.stroke();ctx.setLineDash([]);}
    }
    const pUlt=puts.filter(r=>r._iv_ult>0&&inView(r));
    if(pUlt.length>=2){ctx.strokeStyle='rgba(201,150,10,0.7)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();pUlt.forEach((r,i)=>i===0?ctx.moveTo(xs(r.strike),ys(r._iv_ult)):ctx.lineTo(xs(r.strike),ys(r._iv_ult)));ctx.stroke();ctx.setLineDash([]);}
  }

  // ── Puntos BO (radio 3, se dibujan antes) ──
  if(showCalls && soloUno){
    callsBO.filter(inView).forEach(r=>{
      if(r.vi_bid>0){ctx.beginPath();ctx.arc(xs(r.strike),ys(r.vi_bid),3,0,Math.PI*2);ctx.fillStyle='rgba(58,176,122,0.9)';ctx.fill();}
      if(r.vi_offer>0){ctx.beginPath();ctx.arc(xs(r.strike),ys(r.vi_offer),3,0,Math.PI*2);ctx.fillStyle='rgba(192,57,43,0.9)';ctx.fill();}
    });
  }
  if(showPuts && soloUno){
    putsBO.filter(inView).forEach(r=>{
      if(r.vi_bid>0){ctx.beginPath();ctx.arc(xs(r.strike),ys(r.vi_bid),3,0,Math.PI*2);ctx.fillStyle='rgba(58,176,122,0.9)';ctx.fill();}
      if(r.vi_offer>0){ctx.beginPath();ctx.arc(xs(r.strike),ys(r.vi_offer),3,0,Math.PI*2);ctx.fillStyle='rgba(192,57,43,0.9)';ctx.fill();}
    });
  }

  // ── Puntos Últ (radio 6 exterior + radio 3 interior de color BO si coincide) ──
  if(showCalls){
    calls.filter(r=>r._iv_ult>0&&inView(r)).forEach(r=>{
      const x=xs(r.strike),y=ys(r._iv_ult);
      const cUltCol = r.vi_ultimo>0 ? 'rgba(220,220,220,0.9)' : r.iv_source==='teorico' ? 'rgba(140,140,140,0.5)' : 'rgba(180,130,255,0.9)';
      ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle=cUltCol;ctx.fill();
      const boRow=callsBO.find(b=>b.strike===r.strike);
      let innerCol='rgba(180,180,180,0.6)';
      if(boRow){
        const tol=Math.abs(r._iv_ult)*0.005+0.1;
        if(boRow.vi_bid>0&&Math.abs(boRow.vi_bid-r._iv_ult)<tol) innerCol='rgba(58,176,122,1)';
        else if(boRow.vi_offer>0&&Math.abs(boRow.vi_offer-r._iv_ult)<tol) innerCol='rgba(192,57,43,1)';
      }
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=innerCol;ctx.fill();
    });
  }
  if(showPuts){
    puts.filter(r=>r._iv_ult>0&&inView(r)).forEach(r=>{
      const x=xs(r.strike),y=ys(r._iv_ult);
      const pUltCol = r.vi_ultimo>0 ? 'rgba(220,220,0,0.95)' : r.iv_source==='teorico' ? 'rgba(140,140,140,0.5)' : 'rgba(255,160,50,0.9)';
      ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle=pUltCol;ctx.fill();
      const boRow=putsBO.find(b=>b.strike===r.strike);
      let innerCol='rgba(150,110,5,0.6)';
      if(boRow){
        const tol=Math.abs(r._iv_ult)*0.005+0.1;
        if(boRow.vi_bid>0&&Math.abs(boRow.vi_bid-r._iv_ult)<tol) innerCol='rgba(58,176,122,1)';
        else if(boRow.vi_offer>0&&Math.abs(boRow.vi_offer-r._iv_ult)<tol) innerCol='rgba(192,57,43,1)';
      }
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=innerCol;ctx.fill();
    });
  }

  ctx.restore();

  // Leyenda
  let lx=pad.l; ctx.font='9px monospace'; ctx.textAlign='left';
  for(const [label,col,isLine] of legendItems){
    if(isLine){
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.setLineDash([5,3]);
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+16,ly); ctx.stroke(); ctx.setLineDash([]);
    } else {
      ctx.beginPath(); ctx.arc(lx+8,ly,4,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
    }
    ctx.fillStyle='#c8c0b0';
    ctx.fillText(label,lx+20,ly+3);
    lx += 20 + ctx.measureText(label).width + 14;
  }
}

// ── RESUMEN ────────────────────────────────────────────────────────────────────
function renderResumen() {
  const subs = [...state.subyacentes].sort((a,b)=>(b.volumen_ars||0)-(a.volumen_ars||0));
  if (!subs.length) { showEmpty('Sin datos de resumen'); return; }

  const pc = state.resumen.put_call_ratio || {};
  const totVol = subs.reduce((a,s)=>a+(s.volumen_ars||0),0);
  const totOI  = subs.reduce((a,s)=>a+(s.open_interest||0),0);
  const totOps = subs.reduce((a,s)=>a+(s.calls||0)+(s.puts||0),0);

  let html = `<div style="padding:16px 20px;overflow:auto;height:100%">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
      ${[
        ['Fecha datos', esc(state.resumen.fecha||'—'), ''],
        ['Opciones', fmtN(totOps), '#C9960A'],
        ['Vol ARS total', fmtM(totVol), '#C9960A'],
        ['OI total', fmtN(totOI), ''],
      ].map(([l,v,c])=>`<div class="res-card">
        <div class="res-title">${l}</div>
        <div style="font-size:15px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${c||'#e8e0cc'}">${v}</div>
      </div>`).join('')}
    </div>
    <div class="resumen-grid" style="padding:0">`;
  for (const s of subs) {
    const r = pc[s.subyacente];
    const pcTxt = (typeof r==='number'&&isFinite(r)) ? (r>PC_CAP?'>'+PC_CAP:r.toFixed(2)) : '—';
    const pctVol = totVol>0 ? Math.round((s.volumen_ars||0)/totVol*100) : 0;
    html += `<div class="res-card">
      <div class="res-title">${esc(s.subyacente)}</div>
      <div class="res-row"><span class="res-suby">${s.calls||0} calls · ${s.puts||0} puts</span><span class="res-val">P/C ${pcTxt}</span></div>
      <div class="res-row"><span>Vol ARS</span><span class="res-val">${fmtM(s.volumen_ars)}</span></div>
      <div class="res-row"><span>OI</span><span class="res-val">${fmtN(s.open_interest)}</span></div>
      <div class="res-bar"><div class="res-bar-fill" style="width:${pctVol}%"></div></div>
    </div>`;
  }
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}

// ── CSV ────────────────────────────────────────────────────────────────────────
function exportCSV() {
  const rows = getFilteredRows();
  if (!rows.length) return;
  const cols = ['symbol','symbol_raw','tipo','strike','vencimiento','dias_vto','moneyness',
    'ultimo_precio','vi_bid','vi_offer','vol_implicita','valor_temporal',
    'precio_teorico','desvio_teorico','volumen_ars','open_interest','precio_suby'];
  const sep = ';';  // es-AR / Excel
  const head = cols.join(sep);
  const lines = rows.map(r => cols.map(c => {
    let v = r[c];
    if (v == null) return '';
    v = String(v).replace(/"/g,'""');
    return /[",;\n]/.test(v) ? `"${v}"` : v;
  }).join(sep));
  const blob = new Blob(['\ufeff' + head + '\n' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `opciones_${state.currentSuby||'todos'}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── EVENTOS / INIT ─────────────────────────────────────────────────────────────
function wireEvents() {
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.addEventListener('click', () => switchView(b.dataset.view, b)));

  const onFilterChange = () => {
    if (!state.currentSuby) return;
    updateSubyHeader(state.currentSuby);
    renderView();
  };
  for (const id of ['ctrl-tipo','ctrl-vto','ctrl-show']) {
    document.getElementById(id).addEventListener('change', onFilterChange);
  }

  document.getElementById('sidebar').addEventListener('click', e => {
    const b = e.target.closest('.sb-btn');
    if (b?.dataset.suby) loadCadena(b.dataset.suby);
  });

  document.getElementById('btn-csv').addEventListener('click', exportCSV);
}

document.getElementById('auth-screen').style.display = 'none';
document.getElementById('app').style.display = 'block';
wireEvents();
loadData();
setInterval(loadData, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadData(); });

let _rsT;
window.addEventListener('resize', () => {
  clearTimeout(_rsT);
  _rsT = setTimeout(() => { if (state.view === 'smile' && state.currentSuby) renderSmile(); }, 200);
});
